name: ApplicationVersion on PR

# GitHub cannot run a git pre-commit on main. This is that hook: commit the
# next ApplicationVersion onto the PR head so it merges with the product review.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    # Do not even start for PRs that only touch Version.props / markdown — the
    # bump job skips them anyway. Bump Display Version's bot PR is exactly that,
    # and GitHub now holds pull_request runs triggered by github-actions[bot]
    # for approval; Bump Display squash-merges within seconds, so the held run
    # "expired" and showed a red X (#423 on PR #167, also #297, #235, #227, #220).
    # Job-level `if:` cannot help: approval is checked before jobs are evaluated.
    paths-ignore:
      - "**.md"
      - "Version.props"

concurrency:
  group: pr-application-version-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  # When every job is skipped, GitHub marks the workflow run failed (red X on
  # Actions). Automation / version-bump PRs must still report success.
  # Also skip when *this synchronize* was our own Version.props push — otherwise
  # each bump re-enters this workflow and fans out a second CI on the same PR.
  skip-automation:
    name: Skip ApplicationVersion sync
    if: >-
      ${{ github.event.pull_request.head.repo.full_name != github.repository
          || github.actor == 'github-actions[bot]'
          || github.event.pull_request.user.login == 'github-actions[bot]'
          || startsWith(github.head_ref, 'ci/increment-application-version-')
          || startsWith(github.head_ref, 'ci/bump-display-version-')
          || startsWith(github.event.pull_request.title, 'ci:') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "No ApplicationVersion sync for fork / bot actor / ci:* automation PRs."

  bump:
    name: Set ApplicationVersion on feature branch
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'github-actions[bot]'
          && github.event.pull_request.user.login != 'github-actions[bot]'
          && !startsWith(github.head_ref, 'ci/increment-application-version-')
          && !startsWith(github.head_ref, 'ci/bump-display-version-')
          && !startsWith(github.event.pull_request.title, 'ci:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip markdown-only PRs
        id: skip
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          skip=true
          for f in "${files[@]}"; do
            case "$f" in
              *.md|Version.props) ;;
              *) skip=false ;;
            esac
          done
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Sync ApplicationVersion
        if: ${{ steps.skip.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          chmod +x scripts/sync-application-version.sh
          BEFORE=$(sed -n 's/.*<ApplicationVersion>\([0-9][0-9]*\)<\/ApplicationVersion>.*/\1/p' Version.props | head -n 1)
          NEXT=$(./scripts/sync-application-version.sh --write)
          if [[ "${BEFORE}" == "${NEXT}" ]]; then
            echo "ApplicationVersion already ${NEXT}"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Version.props
          # Pushed with GITHUB_TOKEN, which never starts workflows (no push and no
          # pull_request synchronize), so the in-flight product CI is not cancelled
          # or restarted. No skip-CI token in the message: squash merges copy every
          # commit message into main's merge commit, and the token there stopped
          # push CI on main for #155 and #162.
          git commit -m "ci: set ApplicationVersion to ${NEXT} for merge to main"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo "::notice::Feature branch ApplicationVersion ${BEFORE} → ${NEXT}"
