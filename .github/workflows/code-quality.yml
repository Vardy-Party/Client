name: Code Quality

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/github-builds'
  push:
    branches:
      - main
      - develop
      - 'feature/github-builds'

jobs:
  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotNet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Run StyleCop analyzers
        run: dotnet build --configuration Release --no-restore /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
        continue-on-error: true
      
      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true
