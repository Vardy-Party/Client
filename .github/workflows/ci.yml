name: CI - Build & Test

env:
  DOTNET_VERSION: "10.0.x"
  VARDYPARTY_CSPROJ: "VardyParty/VardyParty.csproj"
  VARDYPARTY_CORE_CSPROJ: "VardyParty.Core/VardyParty.Core.csproj"
  TESTS_CSPROJ: "tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj"

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      run_linux_runtime_smoke:
        description: "Run optional Linux runtime smoke test (installs VLC deps)"
        required: false
        default: "false"

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Display version info
        run: |
          APP_VERSION=$(grep -oP '(?<=<ApplicationVersion>)\d+(?=</ApplicationVersion>)' Version.props)
          DISPLAY_VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>)\K[^<]+(?=</ApplicationDisplayVersion>)' Version.props)
          echo "::notice::Building with ApplicationVersion=${APP_VERSION}, ApplicationDisplayVersion=${DISPLAY_VERSION}"
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Restore dependencies
        run: find . -name "*Tests.csproj" -type f -print0 | xargs -0 -I {} dotnet restore {}
      - name: Build test project
        run: find . -name "*Tests.csproj" -type f -print0 | xargs -0 -I {} dotnet build {} -c Release --no-restore
      - name: Run unit tests
        run: find . -name "*Tests.csproj" -type f -print0 | xargs -0 -I {} dotnet test {} -c Release --no-build --verbosity normal

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: test
    if: success()
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-android --ignore-failed-sources
      # - name: Restore dependencies
      #   run: find . -name "*.csproj" -type f -print0 | xargs -0 -I {} dotnet restore {}
      - name: Run StyleCop analyzers
        run: find . -name "*.csproj" -not -name "*Tests.csproj" -type f -print0 | xargs -0 -I {} dotnet build {} -c Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
        continue-on-error: true
      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: code-quality
    if: needs.code-quality.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }} --ignore-failed-sources -r win-x64
      - name: Build Windows app
        run: dotnet build ${{ env.VARDYPARTY_CSPROJ }} -c Release -f net10.0-windows10.0.19041.0
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            VardyParty/
            VardyParty.Core/
            !VardyParty/bin/
            !VardyParty/obj/
            !VardyParty.Core/bin/
            !VardyParty.Core/obj/
          retention-days: 5

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: code-quality
    if: needs.code-quality.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-android --ignore-failed-sources
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Build Android app
        run: dotnet build ${{ env.VARDYPARTY_CSPROJ }} -c Release -f net10.0-android --no-restore -p:AndroidKeyStore=false
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: |
            VardyParty/
            VardyParty.Core/
            !VardyParty/bin/
            !VardyParty/obj/
            !VardyParty.Core/bin/
            !VardyParty.Core/obj/
          retention-days: 5

  build-ios:
    name: Build iOS
    runs-on: macos-26
    needs: code-quality
    if: needs.code-quality.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install ios --ignore-failed-sources
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }} --ignore-failed-sources
      - name: Build iOS app
        run: dotnet build ${{ env.VARDYPARTY_CSPROJ }} -c Release -f net10.0-ios
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-ios
          path: |
            VardyParty/
            VardyParty.Core/
            !VardyParty/bin/
            !VardyParty/obj/
            !VardyParty.Core/bin/
            !VardyParty.Core/obj/
          retention-days: 5

  build-macos:
    name: Build macOS
    runs-on: macos-26
    needs: code-quality
    if: needs.code-quality.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install maccatalyst --ignore-failed-sources
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }} --ignore-failed-sources
      - name: Build macOS app
        run: dotnet build ${{ env.VARDYPARTY_CSPROJ }} -c Release -f net10.0-maccatalyst
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: |
            VardyParty/
            VardyParty.Core/
            !VardyParty/bin/
            !VardyParty/obj/
            !VardyParty.Core/bin/
            !VardyParty.Core/obj/
          retention-days: 5

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: code-quality
    if: needs.code-quality.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Skip Linux runtime dependencies for CI compile
        run: echo "Skipping apt install; Linux runtime packages are not required for dotnet restore/build."
      - name: Restore VardyParty.Linux dependencies
        run: dotnet restore VardyParty.Linux/VardyParty.Linux.csproj
      - name: Build Linux app (x64)
        run: dotnet build VardyParty.Linux/VardyParty.Linux.csproj -c Release -r linux-x64 --no-restore
      - name: Build Linux app (ARM64)
        run: dotnet build VardyParty.Linux/VardyParty.Linux.csproj -c Release -r linux-arm64 --no-restore
      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-x64
          path: |
            VardyParty.Linux/
            VardyParty.Core/
            !VardyParty.Linux/bin/
            !VardyParty.Linux/obj/
            !VardyParty.Core/bin/
            !VardyParty.Core/obj/
          retention-days: 5
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-arm64
          path: |
            VardyParty.Linux/
            VardyParty.Core/
            !VardyParty.Linux/bin/
            !VardyParty.Linux/obj/
            !VardyParty.Core/bin/
            !VardyParty.Core/obj/
          retention-days: 5

  linux-runtime-smoke:
    name: Linux Runtime Smoke (optional)
    runs-on: ubuntu-latest
    needs: build-linux
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_linux_runtime_smoke == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc xvfb
      - name: Restore Linux project
        run: dotnet restore VardyParty.Linux/VardyParty.Linux.csproj
      - name: Publish Linux app (x64)
        run: dotnet publish VardyParty.Linux/VardyParty.Linux.csproj -c Release -r linux-x64 --self-contained false --no-restore
      - name: Runtime smoke test (xvfb)
        run: |
          set +e

          APP_PATH="VardyParty.Linux/bin/Release/net10.0/linux-x64/publish/VardyParty"
          if [ ! -x "$APP_PATH" ]; then
            echo "ERROR: Expected app binary not found or not executable at $APP_PATH"
            echo "Contents of publish directory:"
            ls -la VardyParty.Linux/bin/Release/net10.0/linux-x64/publish || true
            exit 1
          fi

          xvfb-run -a timeout 20s "$APP_PATH"
          RC=$?
          set -e

          if [ "$RC" -eq 124 ]; then
            echo "OK: App launched and stayed running under xvfb (timeout expected)."
            exit 0
          fi

          echo "ERROR: Runtime smoke test failed with exit code $RC"
          exit 1

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - test
      - code-quality
      - build-windows
      - build-android
      - build-ios
      - build-macos
      - build-linux
    if: ${{ always() }}
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.test.result }}" == "failure" || \
                "${{ needs.code-quality.result }}" == "failure" || \
                "${{ needs.build-windows.result }}" == "failure" || \
                "${{ needs.build-android.result }}" == "failure" || \
                "${{ needs.build-ios.result }}" == "failure" || \
                "${{ needs.build-macos.result }}" == "failure" || \
                "${{ needs.build-linux.result }}" == "failure" ]]; then
            echo "❌ CI pipeline failed"
            exit 1
          fi
          echo "✅ CI pipeline passed"
