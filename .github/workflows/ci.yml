name: CI - Build & Test

env:
  # Everything targets net11.0(-*) now, so every job uses the same .NET 11
  # preview SDK pin.
  # There is deliberately no repo global.json: with no pin, dotnet picks the
  # newest installed SDK (previews included), which is what the local build
  # scripts need, while CI jobs pin per-job via setup-dotnet.
  DOTNET_VERSION: "11.0.x"
  VARDYPARTY_CSPROJ: "VardyParty/VardyParty.csproj"
  VARDYPARTY_HOSTING_CSPROJ: "VardyParty.Hosting/VardyParty.Hosting.csproj"
  TESTS_DIR: "tests"
  SKIP_UNITTESTS: "false"
  SKIP_CODEQUALITY: "false"

# Feature-branch CI runs via pull_request only. Push is main-only so a PR push
# does not also fire a duplicate branch push workflow.
#
# Version.props-only bot bump PRs used to skip this workflow (paths allowlist).
# ApplicationVersion now lands on the feature branch; Version.props is in the
# allowlist so that commit still gets checks. Job-level skip still covers
# leftover ci/increment-application-version-* / "ci: auto-increment" PRs.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "**/*.sln"
      - "**/*.slnx"
      - "**/*.csproj"
      - "**/*.cs"
      - "**/*.xaml"
      - "**/*.axaml"
      - "**/*.resx"
      - "**/*.yml"
      - "**/*.yaml"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "**/AndroidManifest.xml"
      - "**/*.plist"
      - "VardyParty/appsettings.json"
      - "VardyParty.Desktop/appsettings.json"
      - "VardyParty/Resources/**"
      - "tests/**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# One run per head branch (or main ref). Duplicate PRs from the same branch
# share this group and cancel each other instead of fan-out.
# Do not cancel in-progress runs on main: two fast merges would otherwise share
# one CI Complete and one ApplicationVersion / GitHub Release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve-flags:
    name: Resolve CI Flags
    # Product CI only. Skip github-actions[bot] / ci/increment-application-version-*
    # / "ci: auto-increment*" PRs, and version commits already on main.
    if: "${{ !((github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'github-actions[bot]' || startsWith(github.head_ref, 'ci/increment-application-version-') || startsWith(github.event.pull_request.title, 'ci: auto-increment'))) || (github.event_name == 'merge_group' && startsWith(github.head_ref, 'ci/increment-application-version-')) || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'ci: auto-increment') || startsWith(github.event.head_commit.message, 'ci: bump')))) }}"
    runs-on: ubuntu-latest
    outputs:
      skip_unittests: ${{ steps.flags.outputs.skip_unittests }}
      skip_codequality: ${{ steps.flags.outputs.skip_codequality }}
    steps:
      - id: flags
        shell: bash
        run: |
          echo "skip_unittests=${SKIP_UNITTESTS}" >> "$GITHUB_OUTPUT"
          echo "skip_codequality=${SKIP_CODEQUALITY}" >> "$GITHUB_OUTPUT"

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: resolve-flags
    if: ${{ needs.resolve-flags.outputs.skip_unittests != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Display version info
        run: |
          APP_VERSION=$(grep -oP '(?<=<ApplicationVersion>)\d+(?=</ApplicationVersion>)' Version.props)
          DISPLAY_VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>)\K[^<]+(?=</ApplicationDisplayVersion>)' Version.props)
          echo "::notice::Building with ApplicationVersion=${APP_VERSION}, ApplicationDisplayVersion=${DISPLAY_VERSION}"
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      # - name: Restore dependencies
      #   run: find . -name "*Tests.csproj" -type f -print0 | xargs -0 -I {} dotnet restore {}
      - name: Build test projects
        run: |
          set -euo pipefail
          while IFS= read -r -d '' proj; do
            echo "::group::Build ${proj}"
            dotnet build "$proj" -c Release
            echo "::endgroup::"
          done < <(find tests -name "*Tests.csproj" -type f -print0)
      - name: Run unit tests
        run: |
          set -euo pipefail
          while IFS= read -r -d '' proj; do
            echo "::group::Test ${proj}"
            dotnet test "$proj" -c Release --no-build --verbosity normal
            echo "::endgroup::"
          done < <(find tests -name "*Tests.csproj" -type f -print0)

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs:
      - resolve-flags
      - test
    if: ${{ needs.resolve-flags.outputs.skip_codequality != 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-android --ignore-failed-sources
      # - name: Restore dependencies
      #   run: find . -name "*.csproj" -type f -print0 | xargs -0 -I {} dotnet restore {}
      # Warnings-as-errors + code-style enforcement. Android Release packaging is
      # not the point of this job: skip signing so a missing keystore cannot fail
      # Code Quality. .NET 11 Android is CoreCLR-only: PublishTrimmed must stay
      # ON (the linker path requires it) and Mono AOT no longer exists (the
      # csproj guards RunAotCompilation to Mono targets).
      # VardyParty.HomeUi / VardyParty.Desktop are excluded: HomeUi is built
      # through the VardyParty head, and Desktop needs the maui-tizen workload;
      # the build-desktop job covers both.
      - name: Run analyzers (warnings as errors)
        run: |
          set -euo pipefail
          while IFS= read -r -d '' proj; do
            echo "::group::Build ${proj}"
            dotnet build "$proj" -c Release \
              /p:TreatWarningsAsErrors=true \
              /p:EnforceCodeStyleInBuild=true \
              /p:AndroidKeyStore=false
            echo "::endgroup::"
          done < <(find . -name "*.csproj" -not -name "*Tests.csproj" \
            -not -name "VardyParty.HomeUi.csproj" -not -name "VardyParty.Desktop.csproj" \
            -type f -print0)
      # --no-restore: everything is already restored by the analyzer step; test
      # projects are restored here so format still checks them. The preview
      # projects stay excluded from formatting (they are exercised by
      # build-desktop / the head builds instead).
      - name: Restore test projects for format check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' proj; do
            dotnet restore "$proj"
          done < <(find tests -name "*Tests.csproj" -type f -print0)
      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic --no-restore --exclude VardyParty.HomeUi/ VardyParty.Desktop/

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs:
      - resolve-flags
      - test
      - code-quality
    if: ${{ always() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.resolve-flags.outputs.skip_unittests == 'true')) && (needs.code-quality.result == 'success' || (needs.code-quality.result == 'skipped' && needs.resolve-flags.outputs.skip_codequality == 'true')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }} --ignore-failed-sources -r win-x64
      - name: Build Windows app
        run: dotnet build ${{ env.VARDYPARTY_CSPROJ }} -c Release -f net11.0-windows10.0.19041.0
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            VardyParty/
            VardyParty.Catalog/
            VardyParty.Streaming/
            VardyParty.Auth/
            VardyParty.Kernel/
            VardyParty.Ports/
            VardyParty.Playback/
            VardyParty.Presentation/
            VardyParty.Hosting/
            !VardyParty/bin/
            !VardyParty/obj/
            !VardyParty.Catalog/bin/
            !VardyParty.Catalog/obj/
            !VardyParty.Streaming/bin/
            !VardyParty.Streaming/obj/
            !VardyParty.Auth/bin/
            !VardyParty.Auth/obj/
            !VardyParty.Kernel/bin/
            !VardyParty.Kernel/obj/
            !VardyParty.Ports/bin/
            !VardyParty.Ports/obj/
            !VardyParty.Playback/bin/
            !VardyParty.Playback/obj/
            !VardyParty.Presentation/bin/
            !VardyParty.Presentation/obj/
            !VardyParty.Hosting/bin/
            !VardyParty.Hosting/obj/
          retention-days: 5

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs:
      - resolve-flags
      - test
      - code-quality
    if: ${{ always() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.resolve-flags.outputs.skip_unittests == 'true')) && (needs.code-quality.result == 'success' || (needs.code-quality.result == 'skipped' && needs.resolve-flags.outputs.skip_codequality == 'true')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-android --ignore-failed-sources
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Restore core dependencies
        run: |
          dotnet restore ${{ env.VARDYPARTY_HOSTING_CSPROJ }} --ignore-failed-sources
          dotnet restore VardyParty.Presentation/VardyParty.Presentation.csproj --ignore-failed-sources
      # .NET 11 Android is CoreCLR-only: UseMonoRuntime is gone (NETSDK1242) and
      # PublishTrimmed must stay ON (XA linker requires it for CoreCLR R2R).
      # PublishReadyToRun=true at restore records the Crossgen2 + android
      # runtime packs as restore downloads; without it the --no-restore build
      # fails on a cold runner with NETSDK1094 (no valid runtime package).
      - name: Restore app dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }} --ignore-failed-sources -p:RuntimeIdentifiers=android-arm64 -r android-arm64 -p:PublishReadyToRun=true
      - name: Restore domain libraries without Android RID
        run: |
          dotnet restore ${{ env.VARDYPARTY_HOSTING_CSPROJ }} --ignore-failed-sources
          dotnet restore VardyParty.Presentation/VardyParty.Presentation.csproj --ignore-failed-sources
      - name: Build Android app
        run: dotnet build ${{ env.VARDYPARTY_CSPROJ }} -c Release -f net11.0-android --no-restore -p:RuntimeIdentifiers=android-arm64 -r android-arm64 -p:AndroidKeyStore=false
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: |
            VardyParty/
            VardyParty.Catalog/
            VardyParty.Streaming/
            VardyParty.Auth/
            VardyParty.Kernel/
            VardyParty.Ports/
            VardyParty.Playback/
            VardyParty.Presentation/
            VardyParty.Hosting/
            !VardyParty/bin/
            !VardyParty/obj/
            !VardyParty.Catalog/bin/
            !VardyParty.Catalog/obj/
            !VardyParty.Streaming/bin/
            !VardyParty.Streaming/obj/
            !VardyParty.Auth/bin/
            !VardyParty.Auth/obj/
            !VardyParty.Kernel/bin/
            !VardyParty.Kernel/obj/
            !VardyParty.Ports/bin/
            !VardyParty.Ports/obj/
            !VardyParty.Playback/bin/
            !VardyParty.Playback/obj/
            !VardyParty.Presentation/bin/
            !VardyParty.Presentation/obj/
            !VardyParty.Hosting/bin/
            !VardyParty.Hosting/obj/
          retention-days: 5

  build-ios:
    name: Build iOS
    runs-on: macos-26
    needs:
      - resolve-flags
      - test
      - code-quality
    if: ${{ always() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.resolve-flags.outputs.skip_unittests == 'true')) && (needs.code-quality.result == 'success' || (needs.code-quality.result == 'skipped' && needs.resolve-flags.outputs.skip_codequality == 'true')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install ios --ignore-failed-sources
      - name: Restore core dependencies
        run: |
          dotnet restore ${{ env.VARDYPARTY_HOSTING_CSPROJ }} --ignore-failed-sources
          dotnet restore VardyParty.Presentation/VardyParty.Presentation.csproj --ignore-failed-sources
      - name: Restore app dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }} --ignore-failed-sources -p:TargetFramework=net11.0-ios -r iossimulator-x64
      # Same re-restore dance as the Android job: the head restore's global
      # TargetFramework/RID poison the assets of every project that keeps
      # TargetFramework negotiation (NETSDK1005 'no target for net11.0').
      # HomeUi must be re-restored too — its ProjectReference deliberately
      # keeps TargetFramework (cross-targeting protocol), so the head restore
      # left it with ios-only assets while the build consumes it as net11.0.
      - name: Restore domain libraries without iOS TFM/RID
        run: |
          dotnet restore ${{ env.VARDYPARTY_HOSTING_CSPROJ }} --ignore-failed-sources
          dotnet restore VardyParty.Presentation/VardyParty.Presentation.csproj --ignore-failed-sources
          dotnet restore VardyParty.HomeUi/VardyParty.HomeUi.csproj --ignore-failed-sources
      - name: Build iOS app
        run: dotnet build ${{ env.VARDYPARTY_CSPROJ }} -c Release -f net11.0-ios -r iossimulator-x64 --no-restore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-ios
          path: |
            VardyParty/
            VardyParty.Catalog/
            VardyParty.Streaming/
            VardyParty.Auth/
            VardyParty.Kernel/
            VardyParty.Ports/
            VardyParty.Playback/
            VardyParty.Presentation/
            VardyParty.Hosting/
            !VardyParty/bin/
            !VardyParty/obj/
            !VardyParty.Catalog/bin/
            !VardyParty.Catalog/obj/
            !VardyParty.Streaming/bin/
            !VardyParty.Streaming/obj/
            !VardyParty.Auth/bin/
            !VardyParty.Auth/obj/
            !VardyParty.Kernel/bin/
            !VardyParty.Kernel/obj/
            !VardyParty.Ports/bin/
            !VardyParty.Ports/obj/
            !VardyParty.Playback/bin/
            !VardyParty.Playback/obj/
            !VardyParty.Presentation/bin/
            !VardyParty.Presentation/obj/
            !VardyParty.Hosting/bin/
            !VardyParty.Hosting/obj/
          retention-days: 5

  build-macos:
    name: Build macOS
    runs-on: macos-26
    needs:
      - resolve-flags
      - test
      - code-quality
    if: ${{ always() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.resolve-flags.outputs.skip_unittests == 'true')) && (needs.code-quality.result == 'success' || (needs.code-quality.result == 'skipped' && needs.resolve-flags.outputs.skip_codequality == 'true')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install maccatalyst --ignore-failed-sources
      - name: Restore core dependencies
        run: |
          dotnet restore ${{ env.VARDYPARTY_HOSTING_CSPROJ }} --ignore-failed-sources
          dotnet restore VardyParty.Presentation/VardyParty.Presentation.csproj --ignore-failed-sources
      - name: Restore app dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }} --ignore-failed-sources -p:TargetFramework=net11.0-maccatalyst -r maccatalyst-x64
      # Same re-restore dance as the Android/iOS jobs (see the iOS job note):
      # projects that keep TargetFramework negotiation — HomeUi above all —
      # must be re-restored plain after the TFM/RID-pinned head restore, and
      # the build must run --no-restore so the implicit restore cannot poison
      # them again.
      - name: Restore domain libraries without macCatalyst TFM/RID
        run: |
          dotnet restore ${{ env.VARDYPARTY_HOSTING_CSPROJ }} --ignore-failed-sources
          dotnet restore VardyParty.Presentation/VardyParty.Presentation.csproj --ignore-failed-sources
          dotnet restore VardyParty.HomeUi/VardyParty.HomeUi.csproj --ignore-failed-sources
      - name: Build macOS app
        run: dotnet build ${{ env.VARDYPARTY_CSPROJ }} -c Release -f net11.0-maccatalyst -r maccatalyst-x64 --no-restore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: |
            VardyParty/
            VardyParty.Catalog/
            VardyParty.Streaming/
            VardyParty.Auth/
            VardyParty.Kernel/
            VardyParty.Ports/
            VardyParty.Playback/
            VardyParty.Presentation/
            VardyParty.Hosting/
            !VardyParty/bin/
            !VardyParty/obj/
            !VardyParty.Catalog/bin/
            !VardyParty.Catalog/obj/
            !VardyParty.Streaming/bin/
            !VardyParty.Streaming/obj/
            !VardyParty.Auth/bin/
            !VardyParty.Auth/obj/
            !VardyParty.Kernel/bin/
            !VardyParty.Kernel/obj/
            !VardyParty.Ports/bin/
            !VardyParty.Ports/obj/
            !VardyParty.Playback/bin/
            !VardyParty.Playback/obj/
            !VardyParty.Presentation/bin/
            !VardyParty.Presentation/obj/
            !VardyParty.Hosting/bin/
            !VardyParty.Hosting/obj/
          retention-days: 5

  # Linux desktop head (VardyParty.Desktop): the shared MAUI XAML homepage
  # (VardyParty.HomeUi) drawn by Avalonia on the .NET 11 preview SDK. See
  # docs/architecture/homepage-maui-avalonia.md.
  build-desktop:
    name: Build Desktop (Linux, MAUI-Avalonia)
    runs-on: ubuntu-latest
    needs:
      - resolve-flags
      - test
      - code-quality
    if: ${{ always() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.resolve-flags.outputs.skip_unittests == 'true')) && (needs.code-quality.result == 'success' || (needs.code-quality.result == 'skipped' && needs.resolve-flags.outputs.skip_codequality == 'true')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      # maui-tizen carries the plain-TFM MAUI SDK on Linux; maui-android is
      # needed because VardyParty.HomeUi cross-targets net11.0-android here.
      - name: Install MAUI workloads
        run: dotnet workload install maui-tizen maui-android --ignore-failed-sources
      - name: Restore desktop head
        run: dotnet restore VardyParty.Desktop/VardyParty.Desktop.csproj --ignore-failed-sources
      - name: Build desktop head
        run: dotnet build VardyParty.Desktop/VardyParty.Desktop.csproj -c Release --no-restore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-desktop
          path: |
            VardyParty.Desktop/bin/Release/net11.0/
          retention-days: 5

  # Startup smoke test for the Linux desktop head (xvfb pattern, modelled on
  # the old VardyParty.Linux runtime smoke). Rebuilds from source: the app must
  # start against sample data and stay alive for 20s under a virtual display.
  desktop-runtime-smoke:
    name: Desktop Runtime Smoke
    runs-on: ubuntu-latest
    needs: build-desktop
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      # Same workloads as build-desktop (HomeUi cross-targets net11.0-android).
      - name: Install MAUI workloads
        run: dotnet workload install maui-tizen maui-android --ignore-failed-sources
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc xvfb
      - name: Restore desktop head
        run: dotnet restore VardyParty.Desktop/VardyParty.Desktop.csproj --ignore-failed-sources
      - name: Build desktop head
        run: dotnet build VardyParty.Desktop/VardyParty.Desktop.csproj -c Release --no-restore
      - name: Runtime smoke test (xvfb, sample data)
        run: |
          set +e
          APP_PATH="VardyParty.Desktop/bin/Release/net11.0/VardyPartyDesktop"
          if [ ! -x "$APP_PATH" ]; then
            echo "ERROR: Expected app binary not found or not executable at $APP_PATH"
            ls -la VardyParty.Desktop/bin/Release/net11.0 || true
            exit 1
          fi

          VARDYPARTY_DESKTOP_SAMPLE_DATA=1 xvfb-run -a timeout 20s "$APP_PATH"
          RC=$?
          set -e

          if [ "$RC" -eq 124 ]; then
            echo "OK: Desktop head launched and stayed running under xvfb (timeout expected)."
            exit 0
          fi

          echo "ERROR: Desktop runtime smoke test failed with exit code $RC"
          exit 1

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - test
      - code-quality
      - build-windows
      - build-android
      - build-ios
      - build-macos
      - build-desktop
      - desktop-runtime-smoke
    if: "${{ always() && !((github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'github-actions[bot]' || startsWith(github.head_ref, 'ci/increment-application-version-') || startsWith(github.event.pull_request.title, 'ci: auto-increment'))) || (github.event_name == 'merge_group' && startsWith(github.head_ref, 'ci/increment-application-version-')) || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'ci: auto-increment') || startsWith(github.event.head_commit.message, 'ci: bump')))) }}"
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.test.result }}" == "skipped" || "${{ needs.code-quality.result }}" == "skipped" ]]; then
            echo "Tasks skipped"
            exit 1
          fi

          if [[ "${{ needs.test.result }}" == "failure" || \
                "${{ needs.code-quality.result }}" == "failure" || \
                "${{ needs.build-windows.result }}" == "failure" || \
                "${{ needs.build-android.result }}" == "failure" || \
                "${{ needs.build-desktop.result }}" == "failure" || \
                "${{ needs.build-desktop.result }}" == "skipped" || \
                "${{ needs.desktop-runtime-smoke.result }}" == "failure" || \
                "${{ needs.desktop-runtime-smoke.result }}" == "skipped" ]]; then
            echo "❌ CI pipeline failed"
            exit 1
          fi
          echo "✅ CI pipeline passed"
