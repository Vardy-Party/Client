name: CI - Build & Test

on:
  pull_request:
    branches:
      - main
      - develop
      - feature/github-builds
  push:
    branches:
      - main
      - develop
      - feature/github-builds

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj
      - name: Build test project
        run: dotnet build tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj -c Release --no-restore
      - name: Run unit tests
        run: dotnet test tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj -c Release --no-build --verbosity normal

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj
      - name: Run StyleCop analyzers
        run: dotnet build tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj -c Release --no-restore /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
        continue-on-error: true
      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update
      - name: Restore all dependencies
        run: dotnet restore VardyParty/VardyParty.csproj
      - name: Build Windows app
        run: dotnet build VardyParty/VardyParty.csproj -c Release -f net10.0-windows10.0.19041.0 --no-restore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: VardyParty/bin/Release/net10.0-windows10.0.19041.0
          retention-days: 5

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Restore all dependencies
        run: dotnet restore VardyParty/VardyParty.csproj
      - name: Build Android app
        run: dotnet build VardyParty/VardyParty.csproj -c Release -f net10.0-android --no-restore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: VardyParty/bin/Release/net10.0-android
          retention-days: 5

  build-ios:
    name: Build iOS
    runs-on: macos-14
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update
      - name: Restore all dependencies
        run: dotnet restore VardyParty/VardyParty.csproj
      - name: Build iOS app
        run: dotnet build VardyParty/VardyParty.csproj -c Release -f net10.0-ios --no-restore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-ios
          path: VardyParty/bin/Release/net10.0-ios
          retention-days: 5

  build-macos:
    name: Build macOS
    runs-on: macos-14
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update
      - name: Restore all dependencies
        run: dotnet restore VardyParty/VardyParty.csproj
      - name: Build macOS app
        run: dotnet build VardyParty/VardyParty.csproj -c Release -f net10.0-maccatalyst --no-restore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: VardyParty/bin/Release/net10.0-maccatalyst
          retention-days: 5

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update
      - name: Restore all dependencies
        run: dotnet restore VardyParty/VardyParty.csproj
      - name: Build core library
        run: dotnet build VardyParty.Core/VardyParty.Core.csproj -c Release -f net10.0 --no-restore
      - name: Build Linux (x64)
        run: dotnet build VardyParty/VardyParty.csproj -c Release -f net10.0 -r linux-x64 --no-restore
      - name: Build Linux (ARM64)
        run: dotnet build VardyParty/VardyParty.csproj -c Release -f net10.0 -r linux-arm64 --no-restore
      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-x64
          path: VardyParty/bin/Release/net10.0
          retention-days: 5
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-arm64
          path: VardyParty/bin/Release/net10.0
          retention-days: 5
