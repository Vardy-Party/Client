name: CI - Build & Test

on:
  pull_request:
    branches:
      - main
      - develop
      - feature/github-builds
  push:
    branches:
      - main
      - develop
      - feature/github-builds
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip unit tests and code quality checks'
        required: false
        default: true
        type: boolean

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj
      - name: Build test project
        run: dotnet build tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj -c Release --no-restore
      - name: Run unit tests
        run: dotnet test tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj -c Release --no-build --verbosity normal

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj
      - name: Run StyleCop analyzers
        run: dotnet build tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj -c Release --no-restore /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true
        continue-on-error: true
      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: code-quality
    if: always() && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update
      - name: Build Windows app
        run: dotnet build VardyParty/VardyParty.csproj -c Release -f net10.0-windows10.0.19041.0
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: VardyParty/bin/Release/net10.0-windows10.0.19041.0
          retention-days: 5

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: code-quality
    if: always() && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install MAUI workloads
        run: dotnet workload install maui-android --ignore-failed-sources
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Build Android app
        run: dotnet build VardyParty/VardyParty.csproj -c Release -f net10.0-android
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: VardyParty/bin/Release/net10.0-android
          retention-days: 5

  build-ios:
    name: Build iOS
    runs-on: macos-26
    needs: code-quality
    if: always() && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install ios --ignore-failed-sources
      - name: Restore dependencies
        run: dotnet restore VardyParty/VardyParty.csproj --ignore-failed-sources
      - name: Build iOS app
        run: dotnet build VardyParty/VardyParty.csproj -c Release -f net10.0-ios --no-restore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-ios
          path: VardyParty/bin/Release/net10.0-ios
          retention-days: 5

  build-macos:
    name: Build macOS
    runs-on: macos-26
    needs: code-quality
    if: always() && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install maccatalyst --ignore-failed-sources
      - name: Build macOS app
        run: dotnet build VardyParty/VardyParty.csproj -c Release -f net10.0-maccatalyst
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: VardyParty/bin/Release/net10.0-maccatalyst
          retention-days: 5

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: code-quality
    if: always() && (needs.code-quality.result == 'success' || needs.code-quality.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build core library (x64)
        run: dotnet build VardyParty.Core/VardyParty.Core.csproj -c Release -f net10.0 -r linux-x64
      - name: Build core library (ARM64)
        run: dotnet build VardyParty.Core/VardyParty.Core.csproj -c Release -f net10.0 -r linux-arm64
      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-x64
          path: VardyParty.Core/bin/Release/net10.0/linux-x64
          retention-days: 5
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-arm64
          path: VardyParty.Core/bin/Release/net10.0/linux-arm64
          retention-days: 5
