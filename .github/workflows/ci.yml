name: CI - Build & Test

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/github-builds'
  push:
    branches:
      - main
      - develop
      - 'feature/github-builds'

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --configuration Release --no-restore
      
      - name: Run unit tests
        run: dotnet test tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj --configuration Release --no-build --verbosity normal

  build-windows:
    name: Build Windows (APPX)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Publish Windows app
        run: dotnet publish VardyParty/VardyParty.csproj -c Release -f net10.0-windows10.0.19041.0 /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true -o ./output/windows
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ./output/windows

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Publish Android app
        run: dotnet publish VardyParty/VardyParty.csproj -c Release -f net10.0-android /p:AndroidPackageFormat=apk -o ./output/android
      
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ./output/android/*.apk

  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Publish iOS app
        run: dotnet publish VardyParty/VardyParty.csproj -c Release -f net10.0-ios /p:ArchiveOnBuild=true -o ./output/ios
      
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ./output/ios

  build-macos:
    name: Build macOS
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Publish macOS app
        run: dotnet publish VardyParty/VardyParty.csproj -c Release -f net10.0-maccatalyst /p:ArchiveOnBuild=true -o ./output/macos
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ./output/macos

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build core library for Linux
        run: dotnet build VardyParty.Core/VardyParty.Core.csproj -c Release -f net10.0
      
      - name: Publish Linux app (net10.0)
        run: dotnet publish VardyParty/VardyParty.csproj -c Release -f net10.0 --self-contained -r linux-x64 -o ./output/linux/x64 || true
      
      - name: Publish Linux app (ARM64)
        run: dotnet publish VardyParty/VardyParty.csproj -c Release -f net10.0 --self-contained -r linux-arm64 -o ./output/linux/arm64 || true
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ./output/linux
