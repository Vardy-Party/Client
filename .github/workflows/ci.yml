name: CI - Build & Test

env:
  DOTNET_VERSION: "10.0.x"
  VARDYPARTY_CSPROJ: "VardyParty/VardyParty.csproj"
  VARDYPARTY_HOSTING_CSPROJ: "VardyParty.Hosting/VardyParty.Hosting.csproj"
  TESTS_CSPROJ: "tests/VardyParty.Core.Tests/VardyParty.Core.Tests.csproj"
  SKIP_UNITTESTS: "false"
  SKIP_CODEQUALITY: "false"

# Feature-branch CI runs via pull_request only. Push is main-only so a PR push
# does not also fire a duplicate branch push workflow.
#
# Version-bump PRs must not run this workflow. GitHub holds pull_request runs
# from first-time authors (including github-actions[bot] until a bot PR has
# been merged) at the *platform* level with conclusion action_required —
# "This workflow is awaiting approval from a maintainer" — before any job
# `if` is evaluated. Skipping jobs is not enough to avoid that click.
# paths-ignore on Version.props means a Version.props-only bump PR never
# queues CI. Job-level skip below is belt-and-suspenders if the workflow is
# still triggered (extra files, merge_group, or a version commit on main).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths-ignore:
      - "Version.props"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# One run per head branch (or main ref). Duplicate PRs from the same branch
# share this group and cancel each other instead of fan-out.
# Do not cancel in-progress runs on main: two fast merges would otherwise share
# one CI Complete and one ApplicationVersion / GitHub Release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve-flags:
    name: Resolve CI Flags
    # Product CI only. Skip github-actions[bot] / ci/increment-application-version-*
    # / "ci: auto-increment*" PRs, and version commits already on main.
    if: "${{ !((github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'github-actions[bot]' || startsWith(github.head_ref, 'ci/increment-application-version-') || startsWith(github.event.pull_request.title, 'ci: auto-increment'))) || (github.event_name == 'merge_group' && startsWith(github.head_ref, 'ci/increment-application-version-')) || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'ci: auto-increment') || startsWith(github.event.head_commit.message, 'ci: bump')))) }}"
    runs-on: ubuntu-latest
    outputs:
      skip_unittests: ${{ steps.flags.outputs.skip_unittests }}
      skip_codequality: ${{ steps.flags.outputs.skip_codequality }}
    steps:
      - id: flags
        shell: bash
        run: |
          echo "skip_unittests=${SKIP_UNITTESTS}" >> "$GITHUB_OUTPUT"
          echo "skip_codequality=${SKIP_CODEQUALITY}" >> "$GITHUB_OUTPUT"

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: resolve-flags
    if: ${{ needs.resolve-flags.outputs.skip_unittests != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Display version info
        run: |
          APP_VERSION=$(grep -oP '(?<=<ApplicationVersion>)\d+(?=</ApplicationVersion>)' Version.props)
          DISPLAY_VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>)\K[^<]+(?=</ApplicationDisplayVersion>)' Version.props)
          echo "::notice::Building with ApplicationVersion=${APP_VERSION}, ApplicationDisplayVersion=${DISPLAY_VERSION}"
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      # - name: Restore dependencies
      #   run: find . -name "*Tests.csproj" -type f -print0 | xargs -0 -I {} dotnet restore {}
      - name: Build test project
        run: find . -name "*Tests.csproj" -type f -print0 | xargs -0 -I {} dotnet build {} -c Release
      - name: Run unit tests
        run: find . -name "*Tests.csproj" -type f -print0 | xargs -0 -I {} dotnet test {} -c Release --no-build --verbosity normal

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs:
      - resolve-flags
      - test
    if: ${{ needs.resolve-flags.outputs.skip_codequality != 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-android --ignore-failed-sources
      # - name: Restore dependencies
      #   run: find . -name "*.csproj" -type f -print0 | xargs -0 -I {} dotnet restore {}
      # Warnings-as-errors + code-style enforcement. Android Release packaging is
      # not the point of this job: skip signing/AOT/trim so a missing keystore
      # cannot fail Code Quality, matching the Build Android job flags.
      - name: Run analyzers (warnings as errors)
        run: |
          set -euo pipefail
          while IFS= read -r -d '' proj; do
            echo "::group::Build ${proj}"
            dotnet build "$proj" -c Release \
              /p:TreatWarningsAsErrors=true \
              /p:EnforceCodeStyleInBuild=true \
              /p:AndroidKeyStore=false \
              /p:RunAotCompilation=false \
              /p:PublishTrimmed=false
            echo "::endgroup::"
          done < <(find . -name "*.csproj" -not -name "*Tests.csproj" -type f -print0)
      - name: Check code formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs:
      - resolve-flags
      - test
      - code-quality
    if: ${{ always() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.resolve-flags.outputs.skip_unittests == 'true')) && (needs.code-quality.result == 'success' || (needs.code-quality.result == 'skipped' && needs.resolve-flags.outputs.skip_codequality == 'true')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-windows --skip-manifest-update
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }} --ignore-failed-sources -r win-x64
      - name: Build Windows app
        run: dotnet build ${{ env.VARDYPARTY_CSPROJ }} -c Release -f net10.0-windows10.0.19041.0
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            VardyParty/
            VardyParty.Catalog/
            VardyParty.Streaming/
            VardyParty.Auth/
            VardyParty.Kernel/
            VardyParty.Playback/
            VardyParty.Presentation/
            VardyParty.Hosting/
            !VardyParty/bin/
            !VardyParty/obj/
            !VardyParty.Catalog/bin/
            !VardyParty.Catalog/obj/
            !VardyParty.Streaming/bin/
            !VardyParty.Streaming/obj/
            !VardyParty.Auth/bin/
            !VardyParty.Auth/obj/
            !VardyParty.Kernel/bin/
            !VardyParty.Kernel/obj/
            !VardyParty.Playback/bin/
            !VardyParty.Playback/obj/
            !VardyParty.Presentation/bin/
            !VardyParty.Presentation/obj/
            !VardyParty.Hosting/bin/
            !VardyParty.Hosting/obj/
          retention-days: 5

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs:
      - resolve-flags
      - test
      - code-quality
    if: ${{ always() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.resolve-flags.outputs.skip_unittests == 'true')) && (needs.code-quality.result == 'success' || (needs.code-quality.result == 'skipped' && needs.resolve-flags.outputs.skip_codequality == 'true')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-android --ignore-failed-sources
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Restore core dependencies
        run: |
          dotnet restore ${{ env.VARDYPARTY_HOSTING_CSPROJ }} --ignore-failed-sources
          dotnet restore VardyParty.Presentation/VardyParty.Presentation.csproj --ignore-failed-sources
      - name: Restore app dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }} --ignore-failed-sources -p:UseMonoRuntime=true -p:RuntimeIdentifiers=android-arm64 -r android-arm64
      - name: Restore domain libraries without Android RID
        run: |
          dotnet restore ${{ env.VARDYPARTY_HOSTING_CSPROJ }} --ignore-failed-sources
          dotnet restore VardyParty.Presentation/VardyParty.Presentation.csproj --ignore-failed-sources
      - name: Build Android app
        run: dotnet build ${{ env.VARDYPARTY_CSPROJ }} -c Release -f net10.0-android --no-restore -p:UseMonoRuntime=true -p:RuntimeIdentifiers=android-arm64 -r android-arm64 -p:AndroidKeyStore=false -p:RunAotCompilation=false -p:PublishTrimmed=false
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: |
            VardyParty/
            VardyParty.Catalog/
            VardyParty.Streaming/
            VardyParty.Auth/
            VardyParty.Kernel/
            VardyParty.Playback/
            VardyParty.Presentation/
            VardyParty.Hosting/
            !VardyParty/bin/
            !VardyParty/obj/
            !VardyParty.Catalog/bin/
            !VardyParty.Catalog/obj/
            !VardyParty.Streaming/bin/
            !VardyParty.Streaming/obj/
            !VardyParty.Auth/bin/
            !VardyParty.Auth/obj/
            !VardyParty.Kernel/bin/
            !VardyParty.Kernel/obj/
            !VardyParty.Playback/bin/
            !VardyParty.Playback/obj/
            !VardyParty.Presentation/bin/
            !VardyParty.Presentation/obj/
            !VardyParty.Hosting/bin/
            !VardyParty.Hosting/obj/
          retention-days: 5

  build-ios:
    name: Build iOS
    runs-on: macos-26
    needs:
      - resolve-flags
      - test
      - code-quality
    if: ${{ always() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.resolve-flags.outputs.skip_unittests == 'true')) && (needs.code-quality.result == 'success' || (needs.code-quality.result == 'skipped' && needs.resolve-flags.outputs.skip_codequality == 'true')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install ios --ignore-failed-sources
      - name: Restore core dependencies
        run: |
          dotnet restore ${{ env.VARDYPARTY_HOSTING_CSPROJ }} --ignore-failed-sources
          dotnet restore VardyParty.Presentation/VardyParty.Presentation.csproj --ignore-failed-sources
      - name: Restore app dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }} --ignore-failed-sources -p:TargetFramework=net10.0-ios -r iossimulator-x64
      - name: Restore domain libraries without iOS RID
        run: |
          dotnet restore ${{ env.VARDYPARTY_HOSTING_CSPROJ }} --ignore-failed-sources
          dotnet restore VardyParty.Presentation/VardyParty.Presentation.csproj --ignore-failed-sources
      - name: Build iOS app
        run: dotnet build ${{ env.VARDYPARTY_CSPROJ }} -c Release -f net10.0-ios -r iossimulator-x64 --no-restore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-ios
          path: |
            VardyParty/
            VardyParty.Catalog/
            VardyParty.Streaming/
            VardyParty.Auth/
            VardyParty.Kernel/
            VardyParty.Playback/
            VardyParty.Presentation/
            VardyParty.Hosting/
            !VardyParty/bin/
            !VardyParty/obj/
            !VardyParty.Catalog/bin/
            !VardyParty.Catalog/obj/
            !VardyParty.Streaming/bin/
            !VardyParty.Streaming/obj/
            !VardyParty.Auth/bin/
            !VardyParty.Auth/obj/
            !VardyParty.Kernel/bin/
            !VardyParty.Kernel/obj/
            !VardyParty.Playback/bin/
            !VardyParty.Playback/obj/
            !VardyParty.Presentation/bin/
            !VardyParty.Presentation/obj/
            !VardyParty.Hosting/bin/
            !VardyParty.Hosting/obj/
          retention-days: 5

  build-macos:
    name: Build macOS
    runs-on: macos-26
    needs:
      - resolve-flags
      - test
      - code-quality
    if: ${{ always() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.resolve-flags.outputs.skip_unittests == 'true')) && (needs.code-quality.result == 'success' || (needs.code-quality.result == 'skipped' && needs.resolve-flags.outputs.skip_codequality == 'true')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install maccatalyst --ignore-failed-sources
      - name: Restore core dependencies
        run: dotnet restore ${{ env.VARDYPARTY_HOSTING_CSPROJ }} --ignore-failed-sources
      - name: Restore app dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }} --ignore-failed-sources -p:TargetFramework=net10.0-maccatalyst -r maccatalyst-x64
      - name: Build macOS app
        run: dotnet build ${{ env.VARDYPARTY_CSPROJ }} -c Release -f net10.0-maccatalyst -r maccatalyst-x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: |
            VardyParty/
            VardyParty.Catalog/
            VardyParty.Streaming/
            VardyParty.Auth/
            VardyParty.Kernel/
            VardyParty.Playback/
            VardyParty.Presentation/
            VardyParty.Hosting/
            !VardyParty/bin/
            !VardyParty/obj/
            !VardyParty.Catalog/bin/
            !VardyParty.Catalog/obj/
            !VardyParty.Streaming/bin/
            !VardyParty.Streaming/obj/
            !VardyParty.Auth/bin/
            !VardyParty.Auth/obj/
            !VardyParty.Kernel/bin/
            !VardyParty.Kernel/obj/
            !VardyParty.Playback/bin/
            !VardyParty.Playback/obj/
            !VardyParty.Presentation/bin/
            !VardyParty.Presentation/obj/
            !VardyParty.Hosting/bin/
            !VardyParty.Hosting/obj/
          retention-days: 5

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs:
      - resolve-flags
      - test
      - code-quality
    if: ${{ always() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.resolve-flags.outputs.skip_unittests == 'true')) && (needs.code-quality.result == 'success' || (needs.code-quality.result == 'skipped' && needs.resolve-flags.outputs.skip_codequality == 'true')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Skip Linux runtime dependencies for CI compile
        run: echo "Skipping apt install; Linux runtime packages are not required for dotnet restore/build."
      - name: Restore VardyParty.Linux dependencies
        run: dotnet restore VardyParty.Linux/VardyParty.Linux.csproj
      - name: Build Linux app (x64)
        run: dotnet build VardyParty.Linux/VardyParty.Linux.csproj -c Release -r linux-x64 --no-restore
      - name: Build Linux app (ARM64)
        run: dotnet build VardyParty.Linux/VardyParty.Linux.csproj -c Release -r linux-arm64 --no-restore
      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-x64
          path: |
            VardyParty.Linux/
            VardyParty.Catalog/
            VardyParty.Streaming/
            VardyParty.Auth/
            VardyParty.Kernel/
            VardyParty.Playback/
            VardyParty.Presentation/
            VardyParty.Hosting/
            !VardyParty.Linux/bin/
            !VardyParty.Linux/obj/
            !VardyParty.Catalog/bin/
            !VardyParty.Catalog/obj/
            !VardyParty.Streaming/bin/
            !VardyParty.Streaming/obj/
            !VardyParty.Auth/bin/
            !VardyParty.Auth/obj/
            !VardyParty.Kernel/bin/
            !VardyParty.Kernel/obj/
            !VardyParty.Playback/bin/
            !VardyParty.Playback/obj/
            !VardyParty.Presentation/bin/
            !VardyParty.Presentation/obj/
            !VardyParty.Hosting/bin/
            !VardyParty.Hosting/obj/
          retention-days: 5
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-arm64
          path: |
            VardyParty.Linux/
            VardyParty.Catalog/
            VardyParty.Streaming/
            VardyParty.Auth/
            VardyParty.Kernel/
            VardyParty.Playback/
            VardyParty.Presentation/
            VardyParty.Hosting/
            !VardyParty.Linux/bin/
            !VardyParty.Linux/obj/
            !VardyParty.Catalog/bin/
            !VardyParty.Catalog/obj/
            !VardyParty.Streaming/bin/
            !VardyParty.Streaming/obj/
            !VardyParty.Auth/bin/
            !VardyParty.Auth/obj/
            !VardyParty.Kernel/bin/
            !VardyParty.Kernel/obj/
            !VardyParty.Playback/bin/
            !VardyParty.Playback/obj/
            !VardyParty.Presentation/bin/
            !VardyParty.Presentation/obj/
            !VardyParty.Hosting/bin/
            !VardyParty.Hosting/obj/
          retention-days: 5

  linux-runtime-smoke:
    name: Linux Runtime Smoke
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc xvfb
      - name: Restore Linux project
        run: dotnet restore VardyParty.Linux/VardyParty.Linux.csproj
      - name: Publish Linux app (x64)
        run: dotnet publish VardyParty.Linux/VardyParty.Linux.csproj -c Release -r linux-x64 --self-contained false --no-restore
      - name: Runtime smoke test (xvfb)
        run: |
          set +e

          APP_PATH="VardyParty.Linux/bin/Release/net10.0/linux-x64/publish/VardyParty"
          if [ ! -x "$APP_PATH" ]; then
            echo "ERROR: Expected app binary not found or not executable at $APP_PATH"
            echo "Contents of publish directory:"
            ls -la VardyParty.Linux/bin/Release/net10.0/linux-x64/publish || true
            exit 1
          fi

          xvfb-run -a timeout 20s "$APP_PATH"
          RC=$?
          set -e

          if [ "$RC" -eq 124 ]; then
            echo "OK: App launched and stayed running under xvfb (timeout expected)."
            exit 0
          fi

          echo "ERROR: Runtime smoke test failed with exit code $RC"
          exit 1

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - test
      - code-quality
      - build-windows
      - build-android
      - build-ios
      - build-macos
      - build-linux
      - linux-runtime-smoke
    if: "${{ always() && !((github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'github-actions[bot]' || startsWith(github.head_ref, 'ci/increment-application-version-') || startsWith(github.event.pull_request.title, 'ci: auto-increment'))) || (github.event_name == 'merge_group' && startsWith(github.head_ref, 'ci/increment-application-version-')) || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'ci: auto-increment') || startsWith(github.event.head_commit.message, 'ci: bump')))) }}"
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.test.result }}" == "skipped" || "${{ needs.code-quality.result }}" == "skipped" ]]; then
            echo "Tasks skipped"
            exit 1
          fi

          if [[ "${{ needs.test.result }}" == "failure" || \
                "${{ needs.code-quality.result }}" == "failure" || \
                "${{ needs.build-windows.result }}" == "failure" || \
                "${{ needs.build-android.result }}" == "failure" || \
                "${{ needs.build-linux.result }}" == "failure" || \
                "${{ needs.linux-runtime-smoke.result }}" == "failure" || \
                "${{ needs.linux-runtime-smoke.result }}" == "skipped" ]]; then
            echo "❌ CI pipeline failed"
            exit 1
          fi
          echo "✅ CI pipeline passed"
