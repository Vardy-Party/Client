name: CD - Package & Release

env:
  DOTNET_VERSION: "10.0.x"
  VARDYPARTY_CSPROJ: "VardyParty/VardyParty.csproj"
  CI_RUN_ID: 22078979976

on:
  push:
    branches:
      - feature/packaging

jobs:
  package-windows:
    name: Package Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Decode and install certificate
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}")
          $certPath = "${{ github.workspace }}\VardyParty\certs\vardyparty.pfx"
          New-Item -Path "${{ github.workspace }}\VardyParty\certs" -ItemType Directory -Force
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          $fileSize = (Get-Item $certPath).Length
          if ($fileSize -gt 0) { Write-Host "Certificate file written ($fileSize bytes)" }
          $password = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERT_PASSWORD }}" -Force -AsPlainText
          try {
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $password -ErrorAction Stop
            if ($cert) { 
              Add-Content -Path $env:GITHUB_ENV -Value "CERT_THUMBPRINT=$($cert.Thumbprint)"
              Write-Host "Certificate imported with thumbprint: $($cert.Thumbprint.Substring(0,8))..."
            }
          } catch {
            Write-Host "Error importing certificate: $($_.Exception.Message)"
            exit 1
          }
        shell: powershell
      - name: Verify certificate in store
        run: |
          $certs = Get-ChildItem -Path "Cert:\CurrentUser\My"
          Write-Host "Certificates in CurrentUser\My store:"
          $certs | ForEach-Object { Write-Host "  - $($_.Subject) (Thumbprint: $($_.Thumbprint.Substring(0,8))...)" }
          $certFound = $certs | Where-Object { $_.Thumbprint -eq "${{ env.CERT_THUMBPRINT }}" }
          if ($certFound) {
            Write-Host "Certificate found in store"
          } else {
            Write-Host "Certificate NOT found in store!"
            exit 1
          }
        shell: powershell
      - name: Publish Windows app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net10.0-windows10.0.19041.0 -c Release -p:RunGenerateBuildInfo=true -p:RunGenerateSplash=true -p:PackageCertificateThumbprint="${{ env.CERT_THUMBPRINT }}" -o ./publish-windows
      - name: Create Windows package
        run: |
          cd publish-windows
          7z a -tzip "../VardyParty-windows.zip" *
          cd ..
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: ./VardyParty-windows.zip
          retention-days: 30

  package-android:
    name: Package Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-android --ignore-failed-sources
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Download Android build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Publish Android app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net10.0-android -c Release -p:RunGenerateBuildInfo=true -p:RunGenerateSplash=true -o ./publish-android
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: ./publish-android/*.apk
          retention-days: 30

  package-ios:
    name: Package iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install ios --ignore-failed-sources
      - name: Download iOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-ios
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Publish iOS app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net10.0-ios -c Release -o ./publish-ios
      - name: Create iOS package
        run: |
          cd publish-ios
          zip -r "../VardyParty-ios.zip" .
          cd ..
      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: ios-package
          path: ./VardyParty-ios.zip
          retention-days: 30

  package-macos:
    name: Package macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install maccatalyst --ignore-failed-sources
      - name: Download macOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-macos
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Publish macOS app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net10.0-maccatalyst -c Release -o ./publish-macos
      - name: Create macOS package
        run: |
          cd publish-macos
          zip -r "../VardyParty-macos.zip" .
          cd ..
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: ./VardyParty-macos.zip
          retention-days: 30

  package-linux-x64:
    name: Package Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Download Linux x64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-linux-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore VardyParty.Core/VardyParty.Core.csproj
      - name: Publish Linux x64 library
        run: dotnet publish VardyParty.Core/VardyParty.Core.csproj -f net10.0 -r linux-x64 -c Release -o ./publish-linux-x64
      - name: Create Linux x64 package
        run: tar -czf VardyParty-linux-x64.tar.gz -C publish-linux-x64 .
      - name: Upload Linux x64 package
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-package
          path: ./VardyParty-linux-x64.tar.gz
          retention-days: 30

  package-linux-arm64:
    name: Package Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Download Linux ARM64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-linux-arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore VardyParty.Core/VardyParty.Core.csproj
      - name: Publish Linux ARM64 library
        run: dotnet publish VardyParty.Core/VardyParty.Core.csproj -f net10.0 -r linux-arm64 -c Release -o ./publish-linux-arm64
      - name: Create Linux ARM64 package
        run: tar -czf VardyParty-linux-arm64.tar.gz -C publish-linux-arm64 .
      - name: Upload Linux ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-package
          path: ./VardyParty-linux-arm64.tar.gz
          retention-days: 30
