name: CD - Package & Release

env:
  DOTNET_VERSION: "10.0.x"
  VARDYPARTY_CSPROJ: "VardyParty/VardyParty.csproj"
  ANDROID_KEYSTORE_PATH: "VardyParty/certs/vardyparty.keystore"
  CI_RUN_ID: ${{ github.event.inputs.ci_run_id || github.event.workflow_run.id }}
on:
  workflow_run:
    workflows: ["CI - Build & Test"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI Run ID to download artifacts from (required for feature branches)'
        required: false
        default: ''

jobs:
  package-windows:
    name: Package Windows
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Generate appsettings.json
        run: |
          $appsettingsPath = "VardyParty/appsettings.json"
          $appsettings = @{}
          if (Test-Path $appsettingsPath) {
              try {
                  $appsettings = Get-Content $appsettingsPath -Raw | ConvertFrom-Json
              } catch {
                  $appsettings = @{}
              }
          }
          if (-not $appsettings.Auth0) { $appsettings | Add-Member -NotePropertyName Auth0 -NotePropertyValue @{} }
          if (-not $appsettings.Api) { $appsettings | Add-Member -NotePropertyName Api -NotePropertyValue @{} }
          $appsettings.Auth0.Domain = "${{ secrets.AUTH0_DOMAIN }}"
          $appsettings.Auth0.ClientId = "${{ secrets.AUTH0_CLIENTID }}"
          $appsettings.Auth0.Audience = "${{ secrets.AUTH0_AUDIENCE }}"
          $appsettings.Auth0.Scope = "${{ secrets.AUTH0_SCOPE }}"
          $appsettings.Auth0.CallbackScheme = "${{ secrets.AUTH0_CALLBACKSCHEME }}"
          $appsettings.Auth0.RedirectUri = "${{ secrets.AUTH0_REDIRECTURI }}"
          $appsettings.Auth0.PostLogoutRedirectUri = "${{ secrets.AUTH0_POSTLOGOUTREDIRECTURI }}"
          $appsettings.Auth0.TokenLeewaySeconds = [int]"${{ secrets.AUTH0_TOKENLEEAWAYSECONDS }}"
          $appsettings.Auth0.RequiredRoleClaimType = "${{ secrets.AUTH0_REQUIREDROLECLAIMTYPE }}"
          $appsettings.Auth0.RequiredRole = "${{ secrets.AUTH0_REQUIREDROLE }}"
          $appsettings.Api.HeadlessBaseUrl = "${{ secrets.API_HEADLESSBASEURL }}"
          $appsettings.PSObject.Properties.Remove("AllowUserSecrets")
          $appsettings | ConvertTo-Json -Depth 10 | Out-File -FilePath $appsettingsPath -Encoding UTF8
          Write-Host "appsettings.json merged and AllowUserSecrets removed"
        shell: powershell
      - name: Verify AllowUserSecrets is not in appsettings.json
        run: |
          $appsettingsPath = "VardyParty/appsettings.json"
          $appsettings = Get-Content $appsettingsPath -Raw | ConvertFrom-Json
          if ($appsettings.PSObject.Properties.Name -contains "AllowUserSecrets") {
              Write-Host "ERROR: AllowUserSecrets found in appsettings.json"
              exit 1
          }
          Write-Host "OK: AllowUserSecrets not found in appsettings.json"
        shell: powershell
      - name: Decode and install certificate
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}")
          $certPath = "${{ github.workspace }}\VardyParty\certs\vardyparty.pfx"
          New-Item -Path "${{ github.workspace }}\VardyParty\certs" -ItemType Directory -Force
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          $fileSize = (Get-Item $certPath).Length
          if ($fileSize -gt 0) { Write-Host "Certificate file written ($fileSize bytes)" }
          $password = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERT_PASSWORD }}" -Force -AsPlainText
          try {
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $password -ErrorAction Stop
            if ($cert) { 
              Write-Host "Certificate imported"
              $csprojPath = "${{ github.workspace }}\VardyParty\VardyParty.csproj"
              [xml]$csproj = Get-Content $csprojPath
              $thumbprintNodes = $csproj.SelectNodes('//PackageCertificateThumbprint')
              foreach ($node in $thumbprintNodes) {
                $node.InnerText = $cert.Thumbprint
              }
              $csproj.Save($csprojPath)
            }
          } catch {
            Write-Host "Error: $($_.Exception.Message)"
            exit 1
          }
        shell: powershell
      - name: Publish Windows app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net10.0-windows10.0.19041.0 -c Release -p:RunGenerateBuildInfo=true -p:RunGenerateSplash=true
      - name: Extract MSIX package
        run: |
          $msixPath = Get-ChildItem -Path "VardyParty/bin/Release/net10.0-windows10.0.19041.0/win-x64/AppPackages" -Filter "*.msix" -Recurse | Select-Object -First 1
          if ($msixPath) {
            Copy-Item $msixPath.FullName "VardyParty-windows.msix"
            Write-Host "MSIX found: $($msixPath.Name)"
          } else {
            Write-Host "No MSIX file found!"
            exit 1
          }
        shell: powershell
      - name: Prepare Windows package with certificate
        run: |
          $artifactsDir = "windows-artifacts"
          New-Item -ItemType Directory -Path $artifactsDir -Force | Out-Null
          Copy-Item "VardyParty-windows.msix" "$artifactsDir/" -Force
          Copy-Item "VardyParty/certs/vardyparty.pfx" "$artifactsDir/vardyparty.pfx" -Force
          Write-Host "Files prepared in $artifactsDir"
        shell: powershell
      - name: Extract public certificate
        run: |
          $artifactsDir = "windows-artifacts"
          $pfxPath = "$artifactsDir/vardyparty.pfx"
          $cerPath = "$artifactsDir/vardyparty.cer"
          $password = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERT_PASSWORD }}" -Force -AsPlainText
          
          # Load the certificate
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import($pfxPath, $password, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet)
          
          # Export public certificate
          $certBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [System.IO.File]::WriteAllBytes($cerPath, $certBytes)
          
          Write-Host "Public certificate extracted to $cerPath"
        shell: powershell
      - name: Copy AppxManifest and create integrity manifest
        run: |
          $artifactsDir = "windows-artifacts"
          $manifestPath = "VardyParty/bin/Release/net10.0-windows10.0.19041.0/win-x64/AppPackages"
          
          # Copy AppxManifest.xml
          Get-ChildItem -Path $manifestPath -Filter "AppxManifest.xml" -Recurse | ForEach-Object {
            Copy-Item $_.FullName "$artifactsDir/AppxManifest.xml" -Force
          }
          
          # Create integrity manifest with SHA256 hashes
          $hashManifest = @()
          $hashManifest += "# VardyParty Windows Package Integrity Manifest"
          $hashManifest += "# Generated: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          $hashManifest += ""
          
          Get-ChildItem -Path $artifactsDir -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            $hashManifest += "$($_.Name): $hash"
            Write-Host "SHA256($($_.Name)): $hash"
          }
          
          $hashManifest | Out-File -FilePath "$artifactsDir/INTEGRITY.txt" -Encoding UTF8
          Write-Host "Integrity manifest created"
        shell: powershell
      - name: Copy installation documents
        run: |
          $artifactsDir = "windows-artifacts"
          Copy-Item -Path "docs/WINDOWS_INSTALL.md" -Destination "$artifactsDir/WINDOWS_INSTALL.md" -Force
          Write-Host "Installation instructions copied"
        shell: powershell
      - name: Copy installation script
        run: |
          $artifactsDir = "windows-artifacts"
          Copy-Item -Path "scripts/install-msix.ps1" -Destination "$artifactsDir/install.ps1" -Force
          Write-Host "Installation script copied"
        shell: powershell
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: ./windows-artifacts
          retention-days: 30

  package-android:
    name: Package Android
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-android --ignore-failed-sources
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Download Android build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Decode and install keystore
        run: |
          mkdir -p $(dirname ${{ env.ANDROID_KEYSTORE_PATH }})
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ env.ANDROID_KEYSTORE_PATH }}
          
          # Verify keystore file was created
          if [ -f ${{ env.ANDROID_KEYSTORE_PATH }} ]; then
            KEYSTORE_SIZE=$(stat -f%z ${{ env.ANDROID_KEYSTORE_PATH }} 2>/dev/null || stat -c%s ${{ env.ANDROID_KEYSTORE_PATH }} 2>/dev/null)
            echo "✓ Keystore file verified at: ${{ env.ANDROID_KEYSTORE_PATH }}"
            echo "✓ Keystore file size: $KEYSTORE_SIZE bytes"
            ls -lh ${{ env.ANDROID_KEYSTORE_PATH }}
          else
            echo "✗ ERROR: Keystore file not found at ${{ env.ANDROID_KEYSTORE_PATH }}"
            exit 1
          fi
        shell: bash
      - name: Generate appsettings.json
        run: |
          APPSETTINGS_PATH="VardyParty/appsettings.json"
          if [ -f "$APPSETTINGS_PATH" ]; then
            BASE_JSON=$(cat "$APPSETTINGS_PATH")
          else
            BASE_JSON="{}"
          fi
          echo "$BASE_JSON" | jq \
            --arg domain "${{ secrets.AUTH0_DOMAIN }}" \
            --arg clientId "${{ secrets.AUTH0_CLIENTID }}" \
            --arg audience "${{ secrets.AUTH0_AUDIENCE }}" \
            --arg scope "${{ secrets.AUTH0_SCOPE }}" \
            --arg callbackScheme "${{ secrets.AUTH0_CALLBACKSCHEME }}" \
            --arg redirectUri "${{ secrets.AUTH0_REDIRECTURI }}" \
            --arg postLogoutRedirectUri "${{ secrets.AUTH0_POSTLOGOUTREDIRECTURI }}" \
            --argjson tokenLeewaySeconds "${{ secrets.AUTH0_TOKENLEEAWAYSECONDS }}" \
            --arg requiredRoleClaimType "${{ secrets.AUTH0_REQUIREDROLECLAIMTYPE }}" \
            --arg requiredRole "${{ secrets.AUTH0_REQUIREDROLE }}" \
            --arg headlessBaseUrl "${{ secrets.API_HEADLESSBASEURL }}" \
            '(.Auth0 //= {})
             | (.Api //= {})
             | .Auth0.Domain = $domain
             | .Auth0.ClientId = $clientId
             | .Auth0.Audience = $audience
             | .Auth0.Scope = $scope
             | .Auth0.CallbackScheme = $callbackScheme
             | .Auth0.RedirectUri = $redirectUri
             | .Auth0.PostLogoutRedirectUri = $postLogoutRedirectUri
             | .Auth0.TokenLeewaySeconds = $tokenLeewaySeconds
             | .Auth0.RequiredRoleClaimType = $requiredRoleClaimType
             | .Auth0.RequiredRole = $requiredRole
             | .Api.HeadlessBaseUrl = $headlessBaseUrl
             | del(.AllowUserSecrets)' \
            > "$APPSETTINGS_PATH"
          echo "appsettings.json merged and AllowUserSecrets removed"
        shell: bash
      - name: Verify AllowUserSecrets is not in appsettings.json
        run: |
          APPSETTINGS_PATH="VardyParty/appsettings.json"
          if grep -q "AllowUserSecrets" "$APPSETTINGS_PATH"; then
            echo "ERROR: AllowUserSecrets found in appsettings.json"
            exit 1
          fi
          echo "OK: AllowUserSecrets not found in appsettings.json"
        shell: bash
      - name: Publish Android app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net10.0-android -c Release -p:RunGenerateBuildInfo=true -p:RunGenerateSplash=true -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
      - name: Verify APK Signature
        continue-on-error: true
        run: |
          # Find all APK files
          APK_FILES=($(find ./VardyParty/bin/Release/net10.0-android -name "*Signed.apk" -type f))
          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "ERROR: No APK files found"
            exit 1
          fi
          
          # Verify only the first APK (all are binary-identical)
          APK_FILE="${APK_FILES[0]}"
          echo "Verifying APK: $APK_FILE"
          
          # Find apksigner in Android SDK
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner"
          
          # Verify signature with apksigner (non-fatal if tool fails)
          if "$APKSIGNER" verify --print-certs "$APK_FILE" > apk-signature-verification.txt 2>&1; then
            echo "=== APK Signature Verification ==="
            cat apk-signature-verification.txt
            
            # Check if signed with debug certificate (FATAL)
            if grep -q "CN=Android Debug" apk-signature-verification.txt; then
              echo ""
              echo "❌ ERROR: APK is signed with Android Debug certificate!"
              echo "Expected production certificate, not debug."
              exit 1
            fi
            
            # Check if apksigner found a valid signature
            if grep -q "Signer #1" apk-signature-verification.txt; then
              echo ""
              echo "✅ APK verified with valid signature"
            else
              echo ""
              echo "⚠️ WARNING: Could not verify APK signature"
            fi
          else
            echo "⚠️ WARNING: APK signature verification tool not available or failed"
            echo "See artifact apk-signature-verification.txt for details"
          fi
        shell: bash
      - name: Prepare Android package artifacts
        run: |
          ARTIFACTS_DIR="android-package-artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          
          # Copy only the first APK (all are binary-identical)
          APK_FILE=$(find ./VardyParty/bin/Release/net10.0-android -name "*Signed.apk" -type f | head -1)
          cp "$APK_FILE" "$ARTIFACTS_DIR/"
          
          # Copy signature verification report
          cp apk-signature-verification.txt "$ARTIFACTS_DIR/"
          
          echo "Prepared artifacts:"
          ls -lh "$ARTIFACTS_DIR"
        shell: bash
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: ./android-package-artifacts
          retention-days: 30

  package-ios:
    name: Package iOS
    runs-on: macos-26
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install ios --ignore-failed-sources
      - name: Download iOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-ios
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Generate appsettings.json
        run: |
          APPSETTINGS_PATH="VardyParty/appsettings.json"
          if [ -f "$APPSETTINGS_PATH" ]; then
            BASE_JSON=$(cat "$APPSETTINGS_PATH")
          else
            BASE_JSON="{}"
          fi
          echo "$BASE_JSON" | jq \
            --arg domain "${{ secrets.AUTH0_DOMAIN }}" \
            --arg clientId "${{ secrets.AUTH0_CLIENTID }}" \
            --arg audience "${{ secrets.AUTH0_AUDIENCE }}" \
            --arg scope "${{ secrets.AUTH0_SCOPE }}" \
            --arg callbackScheme "${{ secrets.AUTH0_CALLBACKSCHEME }}" \
            --arg redirectUri "${{ secrets.AUTH0_REDIRECTURI }}" \
            --arg postLogoutRedirectUri "${{ secrets.AUTH0_POSTLOGOUTREDIRECTURI }}" \
            --argjson tokenLeewaySeconds "${{ secrets.AUTH0_TOKENLEEAWAYSECONDS }}" \
            --arg requiredRoleClaimType "${{ secrets.AUTH0_REQUIREDROLECLAIMTYPE }}" \
            --arg requiredRole "${{ secrets.AUTH0_REQUIREDROLE }}" \
            --arg headlessBaseUrl "${{ secrets.API_HEADLESSBASEURL }}" \
            '(.Auth0 //= {})
             | (.Api //= {})
             | .Auth0.Domain = $domain
             | .Auth0.ClientId = $clientId
             | .Auth0.Audience = $audience
             | .Auth0.Scope = $scope
             | .Auth0.CallbackScheme = $callbackScheme
             | .Auth0.RedirectUri = $redirectUri
             | .Auth0.PostLogoutRedirectUri = $postLogoutRedirectUri
             | .Auth0.TokenLeewaySeconds = $tokenLeewaySeconds
             | .Auth0.RequiredRoleClaimType = $requiredRoleClaimType
             | .Auth0.RequiredRole = $requiredRole
             | .Api.HeadlessBaseUrl = $headlessBaseUrl
             | del(.AllowUserSecrets)' \
            > "$APPSETTINGS_PATH"
          echo "appsettings.json merged and AllowUserSecrets removed"
        shell: bash
      - name: Publish iOS app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net10.0-ios -c Release
      - name: Create iOS package
        run: tar -czf VardyParty-ios.tar.gz -C VardyParty/bin/Release/net10.0-ios/ios-arm64 .
      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: ios-package
          path: ./VardyParty-ios.tar.gz
          retention-days: 30

  package-macos:
    name: Package macOS
    runs-on: macos-26
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install maccatalyst --ignore-failed-sources
      - name: Download macOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-macos
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Generate appsettings.json
        run: |
          APPSETTINGS_PATH="VardyParty/appsettings.json"
          if [ -f "$APPSETTINGS_PATH" ]; then
            BASE_JSON=$(cat "$APPSETTINGS_PATH")
          else
            BASE_JSON="{}"
          fi
          echo "$BASE_JSON" | jq \
            --arg domain "${{ secrets.AUTH0_DOMAIN }}" \
            --arg clientId "${{ secrets.AUTH0_CLIENTID }}" \
            --arg audience "${{ secrets.AUTH0_AUDIENCE }}" \
            --arg scope "${{ secrets.AUTH0_SCOPE }}" \
            --arg callbackScheme "${{ secrets.AUTH0_CALLBACKSCHEME }}" \
            --arg redirectUri "${{ secrets.AUTH0_REDIRECTURI }}" \
            --arg postLogoutRedirectUri "${{ secrets.AUTH0_POSTLOGOUTREDIRECTURI }}" \
            --argjson tokenLeewaySeconds "${{ secrets.AUTH0_TOKENLEEAWAYSECONDS }}" \
            --arg requiredRoleClaimType "${{ secrets.AUTH0_REQUIREDROLECLAIMTYPE }}" \
            --arg requiredRole "${{ secrets.AUTH0_REQUIREDROLE }}" \
            --arg headlessBaseUrl "${{ secrets.API_HEADLESSBASEURL }}" \
            '(.Auth0 //= {})
             | (.Api //= {})
             | .Auth0.Domain = $domain
             | .Auth0.ClientId = $clientId
             | .Auth0.Audience = $audience
             | .Auth0.Scope = $scope
             | .Auth0.CallbackScheme = $callbackScheme
             | .Auth0.RedirectUri = $redirectUri
             | .Auth0.PostLogoutRedirectUri = $postLogoutRedirectUri
             | .Auth0.TokenLeewaySeconds = $tokenLeewaySeconds
             | .Auth0.RequiredRoleClaimType = $requiredRoleClaimType
             | .Auth0.RequiredRole = $requiredRole
             | .Api.HeadlessBaseUrl = $headlessBaseUrl
             | del(.AllowUserSecrets)' \
            > "$APPSETTINGS_PATH"
          echo "appsettings.json merged and AllowUserSecrets removed"
        shell: bash
      - name: Publish macOS app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net10.0-maccatalyst -c Release
      - name: Create macOS package
        run: tar -czf VardyParty-macos.tar.gz -C VardyParty/bin/Release/net10.0-maccatalyst/maccatalyst-arm64 .
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: ./VardyParty-macos.tar.gz
          retention-days: 30

  package-linux-x64:
    name: Package Linux x64
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc
      - name: Download Linux x64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-linux-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore VardyParty.Linux/VardyParty.Linux.csproj
      - name: Generate appsettings.json for Linux
        run: |
          APPSETTINGS_PATH="VardyParty.Linux/appsettings.json"
          echo "{}" | jq \
            --arg domain "${{ secrets.AUTH0_DOMAIN }}" \
            --arg clientId "${{ secrets.AUTH0_CLIENTID }}" \
            --arg audience "${{ secrets.AUTH0_AUDIENCE }}" \
            --arg scope "${{ secrets.AUTH0_SCOPE }}" \
            --arg callbackScheme "${{ secrets.AUTH0_CALLBACKSCHEME }}" \
            --arg redirectUri "${{ secrets.AUTH0_REDIRECTURI }}" \
            --arg postLogoutRedirectUri "${{ secrets.AUTH0_POSTLOGOUTREDIRECTURI }}" \
            --argjson tokenLeewaySeconds "${{ secrets.AUTH0_TOKENLEEAWAYSECONDS }}" \
            --arg requiredRoleClaimType "${{ secrets.AUTH0_REQUIREDROLECLAIMTYPE }}" \
            --arg requiredRole "${{ secrets.AUTH0_REQUIREDROLE }}" \
            --arg headlessBaseUrl "${{ secrets.API_HEADLESSBASEURL }}" \
            '{"Auth0": {
                "Domain": $domain,
                "ClientId": $clientId,
                "Audience": $audience,
                "Scope": $scope,
                "CallbackScheme": $callbackScheme,
                "RedirectUri": $redirectUri,
                "PostLogoutRedirectUri": $postLogoutRedirectUri,
                "TokenLeewaySeconds": $tokenLeewaySeconds,
                "RequiredRoleClaimType": $requiredRoleClaimType,
                "RequiredRole": $requiredRole
              },
              "Api": {
                "HeadlessBaseUrl": $headlessBaseUrl
              }}' \
            > "$APPSETTINGS_PATH"
          echo "appsettings.json generated for Linux x64"
        shell: bash
      - name: Publish Linux x64 application
        run: dotnet publish VardyParty.Linux/VardyParty.Linux.csproj -f net10.0 -r linux-x64 -c Release --self-contained -p:PublishSingleFile=false
      - name: Create Linux x64 package
        run: |
          cd VardyParty.Linux/bin/Release/net10.0/linux-x64/publish
          tar -czf ../../../../../VardyParty-linux-x64.tar.gz .
          cd ../../../../../
          echo "Created VardyParty-linux-x64.tar.gz"
          ls -lh VardyParty-linux-x64.tar.gz
        shell: bash
      - name: Upload Linux x64 package
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-package
          path: ./VardyParty-linux-x64.tar.gz
          retention-days: 30

  package-linux-arm64:
    name: Package Linux ARM64
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev vlc
      - name: Download Linux ARM64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-linux-arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore VardyParty.Linux/VardyParty.Linux.csproj
      - name: Generate appsettings.json for Linux
        run: |
          APPSETTINGS_PATH="VardyParty.Linux/appsettings.json"
          echo "{}" | jq \
            --arg domain "${{ secrets.AUTH0_DOMAIN }}" \
            --arg clientId "${{ secrets.AUTH0_CLIENTID }}" \
            --arg audience "${{ secrets.AUTH0_AUDIENCE }}" \
            --arg scope "${{ secrets.AUTH0_SCOPE }}" \
            --arg callbackScheme "${{ secrets.AUTH0_CALLBACKSCHEME }}" \
            --arg redirectUri "${{ secrets.AUTH0_REDIRECTURI }}" \
            --arg postLogoutRedirectUri "${{ secrets.AUTH0_POSTLOGOUTREDIRECTURI }}" \
            --argjson tokenLeewaySeconds "${{ secrets.AUTH0_TOKENLEEAWAYSECONDS }}" \
            --arg requiredRoleClaimType "${{ secrets.AUTH0_REQUIREDROLECLAIMTYPE }}" \
            --arg requiredRole "${{ secrets.AUTH0_REQUIREDROLE }}" \
            --arg headlessBaseUrl "${{ secrets.API_HEADLESSBASEURL }}" \
            '{"Auth0": {
                "Domain": $domain,
                "ClientId": $clientId,
                "Audience": $audience,
                "Scope": $scope,
                "CallbackScheme": $callbackScheme,
                "RedirectUri": $redirectUri,
                "PostLogoutRedirectUri": $postLogoutRedirectUri,
                "TokenLeewaySeconds": $tokenLeewaySeconds,
                "RequiredRoleClaimType": $requiredRoleClaimType,
                "RequiredRole": $requiredRole
              },
              "Api": {
                "HeadlessBaseUrl": $headlessBaseUrl
              }}' \
            > "$APPSETTINGS_PATH"
          echo "appsettings.json generated for Linux ARM64"
        shell: bash
      - name: Publish Linux ARM64 application
        run: dotnet publish VardyParty.Linux/VardyParty.Linux.csproj -f net10.0 -r linux-arm64 -c Release --self-contained -p:PublishSingleFile=false
      - name: Create Linux ARM64 package
        run: |
          cd VardyParty.Linux/bin/Release/net10.0/linux-arm64/publish
          tar -czf ../../../../../VardyParty-linux-arm64.tar.gz .
          cd ../../../../../
          echo "Created VardyParty-linux-arm64.tar.gz"
          ls -lh VardyParty-linux-arm64.tar.gz
        shell: bash
      - name: Upload Linux ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-package
          path: ./VardyParty-linux-arm64.tar.gz
          retention-days: 30