name: CD - Package & Release

# Packaging is dispatched by "Increment Build Version" after it allocates a unique
# ApplicationVersion for a successful main CI run. Running CD in parallel with
# increment (workflow_run on CI) packaged whatever Version.props was already on
# main — so two fast merges shared one release tag (e.g. 1.7.116-b149).
#
# Manual dispatch still works (feature branches / retries). Pass application_version
# to stamp the package; omit it to use Version.props from the checked-out ref.
env:
  # Everything targets net11.0(-*): one preview SDK pin for every job.
  DOTNET_VERSION: "11.0.x"
  VARDYPARTY_CSPROJ: "VardyParty/VardyParty.csproj"
  VARDYPARTY_HOSTING_CSPROJ: "VardyParty.Hosting/VardyParty.Hosting.csproj"
  ANDROID_KEYSTORE_PATH: "VardyParty/certs/vardyparty.keystore"
  CI_RUN_ID: ${{ github.event.inputs.ci_run_id }}
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'CI Run ID to download artifacts from (required for feature branches)'
        required: false
        default: ''
      produce_release_assets:
        description: 'When true (on Main only), publish GitHub Release assets (artifacts are always uploaded).'
        required: false
        default: false
        type: boolean
      application_version:
        description: 'ApplicationVersion to stamp on this package (from Increment Build Version). Empty = Version.props as checked out.'
        required: false
        default: ''
      package_sha:
        description: 'Git SHA of the CI commit to check out (the merge being packaged). Empty = workflow ref.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.package_sha || github.sha }}
      - name: Apply packaged ApplicationVersion
        if: ${{ github.event.inputs.application_version != '' }}
        shell: bash
        env:
          APPLICATION_VERSION: ${{ github.event.inputs.application_version }}
        run: |
          set -euo pipefail
          sed -i.bak "s/<ApplicationVersion>[0-9]*<\/ApplicationVersion>/<ApplicationVersion>${APPLICATION_VERSION}<\/ApplicationVersion>/" Version.props
          rm -f Version.props.bak
          echo "Packaging ApplicationVersion=${APPLICATION_VERSION}"
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Extract app version metadata
        id: app_version
        run: |
          [xml]$versionProps = Get-Content "Version.props"
          $displayNode = $versionProps.SelectSingleNode('//ApplicationDisplayVersion')
          $buildNode = $versionProps.SelectSingleNode('//ApplicationVersion')
          $display = if ($null -ne $displayNode) { $displayNode.InnerText } else { "" }
          $build = if ($null -ne $buildNode) { $buildNode.InnerText } else { "" }
          if ([string]::IsNullOrWhiteSpace($display) -or [string]::IsNullOrWhiteSpace($build)) {
            Write-Host "ERROR: ApplicationDisplayVersion/ApplicationVersion missing in Version.props"
            exit 1
          }
          "APP_DISPLAY_VERSION=$display" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_BUILD_VERSION=$build" | Out-File -FilePath $env:GITHUB_ENV -Append
          "display=$display" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "build=$build" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Using app version: $display (build $build)"
        shell: powershell
      - name: Generate appsettings.json
        run: |
          $appsettingsPath = "VardyParty/appsettings.json"
          $appsettings = @{}
          if (Test-Path $appsettingsPath) {
              try {
                  $appsettings = Get-Content $appsettingsPath -Raw | ConvertFrom-Json
              } catch {
                  $appsettings = @{}
              }
          }
          if (-not $appsettings.Auth0) { $appsettings | Add-Member -NotePropertyName Auth0 -NotePropertyValue @{} }
          if (-not $appsettings.Api) { $appsettings | Add-Member -NotePropertyName Api -NotePropertyValue @{} }
          $appsettings.Auth0.Domain = "${{ secrets.AUTH0_DOMAIN }}"
          $appsettings.Auth0.ClientId = "${{ secrets.AUTH0_CLIENTID }}"
          $appsettings.Auth0.Audience = "${{ secrets.AUTH0_AUDIENCE }}"
          $appsettings.Auth0.Scope = "${{ secrets.AUTH0_SCOPE }}"
          $appsettings.Auth0.CallbackScheme = "${{ secrets.AUTH0_CALLBACKSCHEME }}"
          $appsettings.Auth0.RedirectUri = "${{ secrets.AUTH0_REDIRECTURI }}"
          $appsettings.Auth0.PostLogoutRedirectUri = "${{ secrets.AUTH0_POSTLOGOUTREDIRECTURI }}"
          $appsettings.Auth0.TokenLeewaySeconds = [int]"${{ secrets.AUTH0_TOKENLEEAWAYSECONDS }}"
          $appsettings.Auth0.RequiredRoleClaimType = "${{ secrets.AUTH0_REQUIREDROLECLAIMTYPE }}"
          $appsettings.Auth0.RequiredRole = "${{ secrets.AUTH0_REQUIREDROLE }}"
          $appsettings.Api.HeadlessBaseUrl = "${{ secrets.API_HEADLESSBASEURL }}"
          $appsettings.PSObject.Properties.Remove("AllowUserSecrets")
          $appsettings | ConvertTo-Json -Depth 10 | Out-File -FilePath $appsettingsPath -Encoding UTF8
          Write-Host "appsettings.json merged and AllowUserSecrets removed"
        shell: powershell
      - name: Verify AllowUserSecrets is not in appsettings.json
        run: |
          $appsettingsPath = "VardyParty/appsettings.json"
          $appsettings = Get-Content $appsettingsPath -Raw | ConvertFrom-Json
          if ($appsettings.PSObject.Properties.Name -contains "AllowUserSecrets") {
              Write-Host "ERROR: AllowUserSecrets found in appsettings.json"
              exit 1
          }
          Write-Host "OK: AllowUserSecrets not found in appsettings.json"
        shell: powershell
      - name: Decode and install certificate
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}")
          $certPath = "${{ github.workspace }}\VardyParty\certs\vardyparty.pfx"
          New-Item -Path "${{ github.workspace }}\VardyParty\certs" -ItemType Directory -Force
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          $fileSize = (Get-Item $certPath).Length
          if ($fileSize -gt 0) { Write-Host "Certificate file written ($fileSize bytes)" }
          $password = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERT_PASSWORD }}" -Force -AsPlainText
          try {
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $password -ErrorAction Stop
            if ($cert) { 
              Write-Host "Certificate imported"
              $csprojPath = "${{ github.workspace }}\VardyParty\VardyParty.csproj"
              [xml]$csproj = Get-Content $csprojPath
              $thumbprintNodes = $csproj.SelectNodes('//PackageCertificateThumbprint')
              foreach ($node in $thumbprintNodes) {
                $node.InnerText = $cert.Thumbprint
              }
              $csproj.Save($csprojPath)
            }
          } catch {
            Write-Host "Error: $($_.Exception.Message)"
            exit 1
          }
        shell: powershell
      - name: Verify PFX password for signing
        run: |
          $certPath = "${{ github.workspace }}\VardyParty\certs\vardyparty.pfx"
          if (-not (Test-Path $certPath)) {
            Write-Host "ERROR: PFX file not found at $certPath"
            exit 1
          }

          try {
            $pfx = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
            $pfx.Import(
              $certPath,
              "${{ secrets.WINDOWS_CERT_PASSWORD }}",
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            )

            if (-not $pfx.HasPrivateKey) {
              Write-Host "ERROR: PFX loaded but no private key is present"
              exit 1
            }

            Write-Host "PFX password verified successfully"
            Write-Host "Thumbprint: $($pfx.Thumbprint)"
          }
          catch {
            Write-Host "ERROR: Failed to load PFX with provided password. $($_.Exception.Message)"
            exit 1
          }
        shell: powershell
      - name: Publish Windows app
        env:
          MSIX_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net11.0-windows10.0.19041.0 -c Release -p:RunGenerateBuildInfo=true -p:RunGenerateSplash=true
      - name: Extract MSIX package
        run: |
          $searchRoots = @(
            "VardyParty/bin/Release/net11.0-windows10.0.19041.0/win-x64/AppPackages",
            "VardyParty/AppPackages"
          )

          $msixPath = $null
          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              $candidate = Get-ChildItem -Path $root -Filter "*.msix" -Recurse -File |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1
              if ($candidate) {
                $msixPath = $candidate
                break
              }
            }
          }

          if ($msixPath) {
            Copy-Item $msixPath.FullName "VardyParty-windows-v$env:APP_DISPLAY_VERSION-b$env:APP_BUILD_VERSION.msix"
            Write-Host "MSIX found: $($msixPath.FullName)"
          } else {
            Write-Host "No MSIX file found in expected locations."
            foreach ($root in $searchRoots) {
              Write-Host "Checked: $root (exists: $(Test-Path $root))"
            }
            Write-Host "Listing VardyParty/AppPackages (if exists):"
            if (Test-Path "VardyParty/AppPackages") {
              Get-ChildItem -Path "VardyParty/AppPackages" -Recurse | ForEach-Object { Write-Host $_.FullName }
            }
            exit 1
          }
        shell: powershell
      - name: Prepare Windows package with certificate
        run: |
          $artifactsDir = "windows-artifacts"
          New-Item -ItemType Directory -Path $artifactsDir -Force | Out-Null
          Copy-Item "VardyParty-windows-v$env:APP_DISPLAY_VERSION-b$env:APP_BUILD_VERSION.msix" "$artifactsDir/" -Force
          Write-Host "Files prepared in $artifactsDir"
        shell: powershell
      - name: Extract public certificate
        run: |
          $artifactsDir = "windows-artifacts"
          $pfxPath = "${{ github.workspace }}\VardyParty\certs\vardyparty.pfx"
          $cerPath = "$artifactsDir/vardyparty.cer"
          $password = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERT_PASSWORD }}" -Force -AsPlainText

          # Load the certificate from the original location (NOT copied to artifacts)
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import($pfxPath, $password, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet)

          # Export public certificate only
          $certBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [System.IO.File]::WriteAllBytes($cerPath, $certBytes)

          Write-Host "Public certificate extracted to $cerPath (PFX not included in artifacts)"
        shell: powershell
      - name: Copy AppxManifest and create integrity manifest
        run: |
          $artifactsDir = "windows-artifacts"
          $searchRoots = @(
            "VardyParty/bin/Release/net11.0-windows10.0.19041.0/win-x64/AppPackages",
            "VardyParty/AppPackages"
          )

          $manifestCopied = $false
          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              $manifest = Get-ChildItem -Path $root -Filter "AppxManifest.xml" -Recurse -File |
                Select-Object -First 1
              if ($manifest) {
                Copy-Item $manifest.FullName "$artifactsDir/AppxManifest.xml" -Force
                Write-Host "Copied AppxManifest from $($manifest.FullName)"
                $manifestCopied = $true
                break
              }
            }
          }

          if (-not $manifestCopied) {
            Write-Host "Warning: AppxManifest.xml not found in expected AppPackages locations"
          }

          # Create integrity manifest with SHA256 hashes
          $hashManifest = @()
          $hashManifest += "# VardyParty Windows Package Integrity Manifest"
          $hashManifest += "# Generated: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          $hashManifest += ""

          Get-ChildItem -Path $artifactsDir -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            $hashManifest += "$($_.Name): $hash"
            Write-Host "SHA256($($_.Name)): $hash"
          }

          $hashManifest | Out-File -FilePath "$artifactsDir/INTEGRITY.txt" -Encoding UTF8
          Write-Host "Integrity manifest created"
        shell: powershell
      - name: Copy installation documents
        run: |
          $artifactsDir = "windows-artifacts"
          Copy-Item -Path "docs/WINDOWS_INSTALL.md" -Destination "$artifactsDir/WINDOWS_INSTALL.md" -Force
          Write-Host "Installation instructions copied"
        shell: powershell
      - name: Copy installation script
        run: |
          $artifactsDir = "windows-artifacts"
          Copy-Item -Path "scripts/install-msix.ps1" -Destination "$artifactsDir/install.ps1" -Force
          Write-Host "Installation script copied"
        shell: powershell
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-v${{ steps.app_version.outputs.display }}-b${{ steps.app_version.outputs.build }}
          path: ./windows-artifacts
          retention-days: 30
      - name: Publish Windows package as Release asset
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.produce_release_assets == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: "VardyParty v${{ steps.app_version.outputs.display }}-b${{ steps.app_version.outputs.build }}"
          RELEASE_TAG: "${{ steps.app_version.outputs.display }}-b${{ steps.app_version.outputs.build }}"
        run: |
          set -e
          PACKAGE_FILE=$(ls ./windows-artifacts/VardyParty-windows-v*-b*.msix | head -1)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_FILE" --title "$RELEASE_NAME" --notes "Automated package release for $RELEASE_NAME" || gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
          fi
        shell: bash

  package-android:
    name: Package Android
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.package_sha || github.sha }}
      - name: Apply packaged ApplicationVersion
        if: ${{ github.event.inputs.application_version != '' }}
        shell: bash
        env:
          APPLICATION_VERSION: ${{ github.event.inputs.application_version }}
        run: |
          set -euo pipefail
          sed -i.bak "s/<ApplicationVersion>[0-9]*<\/ApplicationVersion>/<ApplicationVersion>${APPLICATION_VERSION}<\/ApplicationVersion>/" Version.props
          rm -f Version.props.bak
          echo "Packaging ApplicationVersion=${APPLICATION_VERSION}"
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-android --ignore-failed-sources
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Restore core dependencies
        run: dotnet restore ${{ env.VARDYPARTY_HOSTING_CSPROJ }} --ignore-failed-sources
      - name: Restore app dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }} --ignore-failed-sources
      - name: Download Android build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Extract app version metadata
        id: app_version
        run: |
          APP_DISPLAY_VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\([^<]*\)</ApplicationDisplayVersion>.*:\1:p' Version.props | head -n 1)
          APP_BUILD_VERSION=$(sed -n 's:.*<ApplicationVersion>\([^<]*\)</ApplicationVersion>.*:\1:p' Version.props | head -n 1)
          if [ -z "$APP_DISPLAY_VERSION" ] || [ -z "$APP_BUILD_VERSION" ]; then
            echo "ERROR: ApplicationDisplayVersion/ApplicationVersion missing in Version.props"
            exit 1
          fi
          echo "APP_DISPLAY_VERSION=$APP_DISPLAY_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD_VERSION=$APP_BUILD_VERSION" >> "$GITHUB_ENV"
          echo "display=$APP_DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$APP_BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using app version: $APP_DISPLAY_VERSION (build $APP_BUILD_VERSION)"
        shell: bash
      - name: Decode and install keystore
        run: |
          mkdir -p $(dirname ${{ env.ANDROID_KEYSTORE_PATH }})
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ env.ANDROID_KEYSTORE_PATH }}
          
          # Verify keystore file was created
          if [ -f ${{ env.ANDROID_KEYSTORE_PATH }} ]; then
            KEYSTORE_SIZE=$(stat -f%z ${{ env.ANDROID_KEYSTORE_PATH }} 2>/dev/null || stat -c%s ${{ env.ANDROID_KEYSTORE_PATH }} 2>/dev/null)
            echo "✓ Keystore file verified at: ${{ env.ANDROID_KEYSTORE_PATH }}"
            echo "✓ Keystore file size: $KEYSTORE_SIZE bytes"
            ls -lh ${{ env.ANDROID_KEYSTORE_PATH }}
          else
            echo "✗ ERROR: Keystore file not found at ${{ env.ANDROID_KEYSTORE_PATH }}"
            exit 1
          fi
        shell: bash
      - name: Generate appsettings.json
        run: |
          APPSETTINGS_PATH="VardyParty/appsettings.json"
          if [ -f "$APPSETTINGS_PATH" ]; then
            BASE_JSON=$(cat "$APPSETTINGS_PATH")
          else
            BASE_JSON="{}"
          fi
          echo "$BASE_JSON" | jq \
            --arg domain "${{ secrets.AUTH0_DOMAIN }}" \
            --arg clientId "${{ secrets.AUTH0_CLIENTID }}" \
            --arg audience "${{ secrets.AUTH0_AUDIENCE }}" \
            --arg scope "${{ secrets.AUTH0_SCOPE }}" \
            --arg callbackScheme "${{ secrets.AUTH0_CALLBACKSCHEME }}" \
            --arg redirectUri "${{ secrets.AUTH0_REDIRECTURI }}" \
            --arg postLogoutRedirectUri "${{ secrets.AUTH0_POSTLOGOUTREDIRECTURI }}" \
            --argjson tokenLeewaySeconds "${{ secrets.AUTH0_TOKENLEEAWAYSECONDS }}" \
            --arg requiredRoleClaimType "${{ secrets.AUTH0_REQUIREDROLECLAIMTYPE }}" \
            --arg requiredRole "${{ secrets.AUTH0_REQUIREDROLE }}" \
            --arg headlessBaseUrl "${{ secrets.API_HEADLESSBASEURL }}" \
            '(.Auth0 //= {})
             | (.Api //= {})
             | .Auth0.Domain = $domain
             | .Auth0.ClientId = $clientId
             | .Auth0.Audience = $audience
             | .Auth0.Scope = $scope
             | .Auth0.CallbackScheme = $callbackScheme
             | .Auth0.RedirectUri = $redirectUri
             | .Auth0.PostLogoutRedirectUri = $postLogoutRedirectUri
             | .Auth0.TokenLeewaySeconds = $tokenLeewaySeconds
             | .Auth0.RequiredRoleClaimType = $requiredRoleClaimType
             | .Auth0.RequiredRole = $requiredRole
             | .Api.HeadlessBaseUrl = $headlessBaseUrl
             | del(.AllowUserSecrets)' \
            > "$APPSETTINGS_PATH"
          echo "appsettings.json merged and AllowUserSecrets removed"
        shell: bash
      - name: Verify AllowUserSecrets is not in appsettings.json
        run: |
          APPSETTINGS_PATH="VardyParty/appsettings.json"
          if grep -q "AllowUserSecrets" "$APPSETTINGS_PATH"; then
            echo "ERROR: AllowUserSecrets found in appsettings.json"
            exit 1
          fi
          echo "OK: AllowUserSecrets not found in appsettings.json"
        shell: bash
      - name: Install Liberation Sans for splash rasterization
        run: |
          # MauiSplashScreen SVG text is baked on the runner. Ubuntu has no Arial,
          # so Skia used to pick DejaVu. Liberation Sans is Arial-metric.
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          fc-cache -f
      - name: Publish Android app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net11.0-android -c Release -p:RunGenerateBuildInfo=true -p:RunGenerateSplash=true -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
      - name: Verify APK Signature
        continue-on-error: true
        run: |
          # Find all APK files
          APK_FILES=($(find ./VardyParty/bin/Release/net11.0-android -name "*Signed.apk" -type f))
          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "ERROR: No APK files found"
            exit 1
          fi
          
          # Verify only the first APK (all are binary-identical)
          APK_FILE="${APK_FILES[0]}"
          echo "Verifying APK: $APK_FILE"
          
          # Find apksigner in Android SDK
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner"
          
          # Verify signature with apksigner (non-fatal if tool fails)
          if "$APKSIGNER" verify --print-certs "$APK_FILE" > apk-signature-verification.txt 2>&1; then
            echo "=== APK Signature Verification ==="
            cat apk-signature-verification.txt
            
            # Check if signed with debug certificate (FATAL)
            if grep -q "CN=Android Debug" apk-signature-verification.txt; then
              echo ""
              echo "❌ ERROR: APK is signed with Android Debug certificate!"
              echo "Expected production certificate, not debug."
              exit 1
            fi
            
            # Check if apksigner found a valid signature
            if grep -q "Signer #1" apk-signature-verification.txt; then
              echo ""
              echo "✅ APK verified with valid signature"
            else
              echo ""
              echo "⚠️ WARNING: Could not verify APK signature"
            fi
          else
            echo "⚠️ WARNING: APK signature verification tool not available or failed"
            echo "See artifact apk-signature-verification.txt for details"
          fi
        shell: bash
      - name: Prepare Android package artifacts
        run: |
          ARTIFACTS_DIR="android-package-artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          
          # Copy universal APK (contains all ABIs)
          APK_FILE=$(find ./VardyParty/bin/Release/net11.0-android -name "*Signed.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No signed APK found"
            exit 1
          fi
          cp "$APK_FILE" "$ARTIFACTS_DIR/VardyParty-android-v${APP_DISPLAY_VERSION}-b${APP_BUILD_VERSION}.apk"
          
          # Copy signature verification report
          cp apk-signature-verification.txt "$ARTIFACTS_DIR/"
          
          echo "Prepared artifacts:"
          ls -lh "$ARTIFACTS_DIR"
        shell: bash
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: android-package-v${{ steps.app_version.outputs.display }}-b${{ steps.app_version.outputs.build }}
          path: ./android-package-artifacts
          retention-days: 30
      - name: Publish Android package as Release asset
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.produce_release_assets == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: "VardyParty v${{ steps.app_version.outputs.display }}-b${{ steps.app_version.outputs.build }}"
          RELEASE_TAG: "${{ steps.app_version.outputs.display }}-b${{ steps.app_version.outputs.build }}"
        run: |
          set -e
          PACKAGE_FILE=$(ls ./android-package-artifacts/VardyParty-android-v*-b*.apk | head -1)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_FILE" --title "$RELEASE_NAME" --notes "Automated package release for $RELEASE_NAME" || gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
          fi
        shell: bash

  package-ios:
    name: Package iOS
    runs-on: macos-26
    if: ${{ github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.package_sha || github.sha }}
      - name: Apply packaged ApplicationVersion
        if: ${{ github.event.inputs.application_version != '' }}
        shell: bash
        env:
          APPLICATION_VERSION: ${{ github.event.inputs.application_version }}
        run: |
          set -euo pipefail
          sed -i.bak "s/<ApplicationVersion>[0-9]*<\/ApplicationVersion>/<ApplicationVersion>${APPLICATION_VERSION}<\/ApplicationVersion>/" Version.props
          rm -f Version.props.bak
          echo "Packaging ApplicationVersion=${APPLICATION_VERSION}"
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install ios --ignore-failed-sources
      - name: Download iOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-ios
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Extract app version metadata
        id: app_version
        run: |
          APP_DISPLAY_VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\([^<]*\)</ApplicationDisplayVersion>.*:\1:p' Version.props | head -n 1)
          APP_BUILD_VERSION=$(sed -n 's:.*<ApplicationVersion>\([^<]*\)</ApplicationVersion>.*:\1:p' Version.props | head -n 1)
          if [ -z "$APP_DISPLAY_VERSION" ] || [ -z "$APP_BUILD_VERSION" ]; then
            echo "ERROR: ApplicationDisplayVersion/ApplicationVersion missing in Version.props"
            exit 1
          fi
          echo "APP_DISPLAY_VERSION=$APP_DISPLAY_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD_VERSION=$APP_BUILD_VERSION" >> "$GITHUB_ENV"
          echo "display=$APP_DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$APP_BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using app version: $APP_DISPLAY_VERSION (build $APP_BUILD_VERSION)"
        shell: bash
      - name: Generate appsettings.json
        run: |
          APPSETTINGS_PATH="VardyParty/appsettings.json"
          if [ -f "$APPSETTINGS_PATH" ]; then
            BASE_JSON=$(cat "$APPSETTINGS_PATH")
          else
            BASE_JSON="{}"
          fi
          echo "$BASE_JSON" | jq \
            --arg domain "${{ secrets.AUTH0_DOMAIN }}" \
            --arg clientId "${{ secrets.AUTH0_CLIENTID }}" \
            --arg audience "${{ secrets.AUTH0_AUDIENCE }}" \
            --arg scope "${{ secrets.AUTH0_SCOPE }}" \
            --arg callbackScheme "${{ secrets.AUTH0_CALLBACKSCHEME }}" \
            --arg redirectUri "${{ secrets.AUTH0_REDIRECTURI }}" \
            --arg postLogoutRedirectUri "${{ secrets.AUTH0_POSTLOGOUTREDIRECTURI }}" \
            --argjson tokenLeewaySeconds "${{ secrets.AUTH0_TOKENLEEAWAYSECONDS }}" \
            --arg requiredRoleClaimType "${{ secrets.AUTH0_REQUIREDROLECLAIMTYPE }}" \
            --arg requiredRole "${{ secrets.AUTH0_REQUIREDROLE }}" \
            --arg headlessBaseUrl "${{ secrets.API_HEADLESSBASEURL }}" \
            '(.Auth0 //= {})
             | (.Api //= {})
             | .Auth0.Domain = $domain
             | .Auth0.ClientId = $clientId
             | .Auth0.Audience = $audience
             | .Auth0.Scope = $scope
             | .Auth0.CallbackScheme = $callbackScheme
             | .Auth0.RedirectUri = $redirectUri
             | .Auth0.PostLogoutRedirectUri = $postLogoutRedirectUri
             | .Auth0.TokenLeewaySeconds = $tokenLeewaySeconds
             | .Auth0.RequiredRoleClaimType = $requiredRoleClaimType
             | .Auth0.RequiredRole = $requiredRole
             | .Api.HeadlessBaseUrl = $headlessBaseUrl
             | del(.AllowUserSecrets)' \
            > "$APPSETTINGS_PATH"
          echo "appsettings.json merged and AllowUserSecrets removed"
        shell: bash
      - name: Verify AllowUserSecrets is not in appsettings.json
        run: |
          APPSETTINGS_PATH="VardyParty/appsettings.json"
          if grep -q "AllowUserSecrets" "$APPSETTINGS_PATH"; then
            echo "ERROR: AllowUserSecrets found in appsettings.json"
            exit 1
          fi
          echo "OK: AllowUserSecrets not found in appsettings.json"
        shell: bash
      - name: Publish iOS app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net11.0-ios -c Release
      - name: Create iOS package
        run: tar -czf VardyParty-ios-v${APP_DISPLAY_VERSION}-b${APP_BUILD_VERSION}.tar.gz -C VardyParty/bin/Release/net11.0-ios/ios-arm64 .
      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: ios-package-v${{ steps.app_version.outputs.display }}-b${{ steps.app_version.outputs.build }}
          path: ./VardyParty-ios-v*-b*.tar.gz
          retention-days: 30
      - name: Publish iOS package as Release asset
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.produce_release_assets == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: "VardyParty v${{ steps.app_version.outputs.display }}-b${{ steps.app_version.outputs.build }}"
          RELEASE_TAG: "${{ steps.app_version.outputs.display }}-b${{ steps.app_version.outputs.build }}"
        run: |
          set -e
          PACKAGE_FILE=$(ls ./VardyParty-ios-v*-b*.tar.gz | head -1)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_FILE" --title "$RELEASE_NAME" --notes "Automated package release for $RELEASE_NAME" || gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
          fi
        shell: bash

