        run: |
          SNAP_VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\([^<]*\)</ApplicationDisplayVersion>.*:\1:p' Version.props | head -n 1)
          SNAP_BUILD=$(sed -n 's:.*<ApplicationVersion>\([^<]*\)</ApplicationVersion>.*:\1:p' Version.props | head -n 1)
          if [ -z "$SNAP_VERSION" ]; then
            echo "ERROR: <ApplicationDisplayVersion> not found in Version.props"
            exit 1
          fi
          if [ -z "$SNAP_BUILD" ]; then
            echo "ERROR: <ApplicationVersion> not found in Version.props"
            exit 1
          fi

          SNAP_FULL_VERSION="${SNAP_VERSION}+${SNAP_BUILD}"
          echo "SNAP_VERSION=$SNAP_VERSION" >> "$GITHUB_ENV"
          echo "SNAP_BUILD=$SNAP_BUILD" >> "$GITHUB_ENV"
          echo "SNAP_FULL_VERSION=$SNAP_FULL_VERSION" >> "$GITHUB_ENV"
          echo "display=$SNAP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$SNAP_BUILD" >> "$GITHUB_OUTPUT"
          echo "full=$SNAP_FULL_VERSION" >> "$GITHUB_OUTPUT"

          cat > snapcraft.yaml << 'EOF'
          name: vardyparty
          title: Vardy Party
          base: core24
          version: '__SNAP_VERSION__'
          summary: Vardy Party Linux client
          description: Vardy Party desktop client packaged as a Snap.
          grade: devel
          confinement: classic
          platforms:
            arm64:

          parts:
            app:
              plugin: dump
              source: VardyParty.Desktop/bin/Release/net11.0/linux-arm64/publish
              override-build: |
                craftctl default
                mkdir -p "$CRAFT_PART_INSTALL/meta/gui"
                cat > "$CRAFT_PART_INSTALL/meta/gui/vardyparty.desktop" << 'DESKTOP'
                [Desktop Entry]
                Name=Vardy Party
                Comment=Vardy Party Linux client
                Exec=vardyparty
                Icon=${SNAP}/meta/gui/vardyparty.svg
                Terminal=false
                Type=Application
                Categories=AudioVideo;Video;
                DESKTOP
                cp "$CRAFT_PROJECT_DIR/VardyParty.Desktop/Assets/vardyparty.svg" "$CRAFT_PART_INSTALL/meta/gui/vardyparty.svg"
                mkdir -p "$CRAFT_PART_INSTALL/bin"
                cat > "$CRAFT_PART_INSTALL/bin/vardyparty-wrapper" << 'WRAPPER'
                #!/bin/bash
                export LD_LIBRARY_PATH="$SNAP/usr/lib:$SNAP/usr/lib/aarch64-linux-gnu:$SNAP/lib:$SNAP/lib/aarch64-linux-gnu:$SNAP/usr/lib/aarch64-linux-gnu/pulseaudio:$LD_LIBRARY_PATH"
                export VLC_PLUGIN_PATH="$SNAP/usr/lib/aarch64-linux-gnu/vlc/plugins"
                exec $SNAP/VardyPartyDesktop "$@"
                WRAPPER
                chmod +x "$CRAFT_PART_INSTALL/bin/vardyparty-wrapper"
              stage-packages:
                - libvlc5
                - libvlccore9
                - vlc-plugin-base
                - vlc-plugin-video-splitter
                - vlc-plugin-video-output
                - vlc-l10n
                - libavcodec60
                - libavformat60
                - libavutil58
                - libswscale7
                - libswresample4
                - libtheora0
                - libopus0
                - libvorbis0a
                - libvorbisenc2
                - libpulse0
                - libice6
                - libsm6
                - libx11-6
                - libxkbcommon0
                - libxcursor1
                - libxinerama1
                - libxrandr2
                - libxrender1
                - libxext6
                - libxft2
                - fontconfig-config
                - fonts-dejavu-core
                - libicu74
              prime:
                - -usr/share/doc
                - -usr/share/man

          apps:
            vardyparty:
              command: bin/vardyparty-wrapper
              desktop: meta/gui/vardyparty.desktop
              environment:
                LD_LIBRARY_PATH: $SNAP/usr/lib:$SNAP/usr/lib/aarch64-linux-gnu:$SNAP/lib:$SNAP/lib/aarch64-linux-gnu
              plugs:
                - network
                - network-bind
                - home
                - audio-playback
                - opengl
                - wayland
                - x11
          EOF
          sed -i "s/__SNAP_VERSION__/$SNAP_FULL_VERSION/" snapcraft.yaml
          echo "Using snap version: $SNAP_FULL_VERSION"
      - name: Validate generated snapcraft.yaml (arm64)
        run: |
          echo "Generated snapcraft.yaml (arm64):"
          cat snapcraft.yaml
          if grep -q '^\s*architectures:' snapcraft.yaml; then
            echo "ERROR: Invalid key 'architectures' found for core24 snapcraft.yaml"
            exit 1
          fi
          if ! grep -q '^\s*platforms:' snapcraft.yaml; then
            echo "ERROR: Required key 'platforms' missing from snapcraft.yaml"
            exit 1
          fi
      - name: Build Linux ARM64 snap
        id: snapcraft_build
        uses: snapcore/action-build@v1
      - name: Rename Linux ARM64 snap package
        run: |
          SNAP_FILE="${{ steps.snapcraft_build.outputs.snap }}"
          OUTPUT_FILE="$GITHUB_WORKSPACE/VardyParty-linux-arm64-v${SNAP_VERSION}+${SNAP_BUILD}.snap"
          mv "$SNAP_FILE" "$OUTPUT_FILE"
          ls -lh "$OUTPUT_FILE"
      - name: Verify Linux ARM64 snap exists
        run: |
          OUTPUT_PATH="$GITHUB_WORKSPACE/VardyParty-linux-arm64-v${SNAP_VERSION}+${SNAP_BUILD}.snap"
          if [ ! -f "$OUTPUT_PATH" ]; then
            echo "ERROR: Linux ARM64 snap not found at $OUTPUT_PATH"
            exit 1
          fi
          echo "OK: Linux ARM64 snap found at $OUTPUT_PATH"
      - name: Upload Linux ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-package-v${{ steps.snap_version.outputs.full }}
          path: ${{ github.workspace }}/VardyParty-linux-arm64-v*+*.snap
          retention-days: 30
      - name: Publish Linux ARM64 package as Release asset
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.produce_release_assets == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: "VardyParty v${{ steps.snap_version.outputs.display }}-b${{ steps.snap_version.outputs.build }}"
          RELEASE_TAG: "${{ steps.snap_version.outputs.display }}-b${{ steps.snap_version.outputs.build }}"
        run: |
          set -e
          PACKAGE_FILE=$(ls $GITHUB_WORKSPACE/VardyParty-linux-arm64-v*+*.snap | head -1)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_FILE" --title "$RELEASE_NAME" --notes "Automated package release for $RELEASE_NAME" || gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
          fi
        shell: bash

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs:
      - package-windows
      - package-android
      - package-ios
      - package-macos
      - package-linux-x64
      - package-linux-arm64
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event.inputs.produce_release_assets == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.package_sha || github.sha }}
      - name: Apply packaged ApplicationVersion
        if: ${{ github.event.inputs.application_version != '' }}
        shell: bash
        env:
          APPLICATION_VERSION: ${{ github.event.inputs.application_version }}
        run: |
          set -euo pipefail
          sed -i.bak "s/<ApplicationVersion>[0-9]*<\/ApplicationVersion>/<ApplicationVersion>${APPLICATION_VERSION}<\/ApplicationVersion>/" Version.props
          rm -f Version.props.bak
          echo "Packaging ApplicationVersion=${APPLICATION_VERSION}"
      - name: Compute shared release tag
        id: release_tag
        run: |
          APP_DISPLAY_VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\([^<]*\)</ApplicationDisplayVersion>.*:\1:p' Version.props | head -n 1)
          APP_BUILD_VERSION=$(sed -n 's:.*<ApplicationVersion>\([^<]*\)</ApplicationVersion>.*:\1:p' Version.props | head -n 1)
          if [ -z "$APP_DISPLAY_VERSION" ] || [ -z "$APP_BUILD_VERSION" ]; then
            echo "ERROR: ApplicationDisplayVersion/ApplicationVersion missing in Version.props"
            exit 1
          fi
          echo "tag=${APP_DISPLAY_VERSION}-b${APP_BUILD_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Print release and asset summary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -e
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG not found. No assets were published."
            exit 0
          fi
          echo "Release summary for tag: $RELEASE_TAG"
          gh release view "$RELEASE_TAG" --json url,name,tagName,assets --jq '. as $r | "Name: \($r.name)\nTag: \($r.tagName)\nURL: \($r.url)\nAssets:\n" + (if ($r.assets|length)==0 then "- (none)" else ($r.assets | map("- " + .name) | join("\n")) end)'
        shell: bash