name: CD - Package & Release

env:
  DOTNET_VERSION: "10.0.x"
  VARDYPARTY_CSPROJ: "VardyParty/VardyParty.csproj"
  CI_RUN_ID: 22081915754

on:
  push:
    branches:
      - feature/packaging
  workflow_dispatch:

jobs:
  package-windows:
    name: Package Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: dotnet workload install maui --skip-manifest-update
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Decode and install certificate
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}")
          $certPath = "${{ github.workspace }}\VardyParty\certs\vardyparty.pfx"
          New-Item -Path "${{ github.workspace }}\VardyParty\certs" -ItemType Directory -Force
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          $fileSize = (Get-Item $certPath).Length
          if ($fileSize -gt 0) { Write-Host "Certificate file written ($fileSize bytes)" }
          $password = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERT_PASSWORD }}" -Force -AsPlainText
          try {
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $password -ErrorAction Stop
            if ($cert) { 
              Write-Host "Certificate imported"
              $csprojPath = "${{ github.workspace }}\VardyParty\VardyParty.csproj"
              [xml]$csproj = Get-Content $csprojPath
              $thumbprintNodes = $csproj.SelectNodes('//PackageCertificateThumbprint')
              foreach ($node in $thumbprintNodes) {
                $node.InnerText = $cert.Thumbprint
              }
              $csproj.Save($csprojPath)
            }
          } catch {
            Write-Host "Error: $($_.Exception.Message)"
            exit 1
          }
        shell: powershell
      - name: Publish Windows app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net10.0-windows10.0.19041.0 -c Release -p:RunGenerateBuildInfo=true -p:RunGenerateSplash=true
      - name: Extract MSIX package
        run: |
          $msixPath = Get-ChildItem -Path "VardyParty/bin/Release/net10.0-windows10.0.19041.0/win-x64/AppPackages" -Filter "*.msix" -Recurse | Select-Object -First 1
          if ($msixPath) {
            Copy-Item $msixPath.FullName "VardyParty-windows.msix"
            Write-Host "MSIX found: $($msixPath.Name)"
          } else {
            Write-Host "No MSIX file found!"
            exit 1
          }
        shell: powershell
      - name: Prepare Windows package with certificate
        run: |
          $artifactsDir = "windows-artifacts"
          New-Item -ItemType Directory -Path $artifactsDir -Force | Out-Null
          Copy-Item "VardyParty-windows.msix" "$artifactsDir/" -Force
          Copy-Item "VardyParty/certs/vardyparty.pfx" "$artifactsDir/vardyparty.pfx" -Force
          Write-Host "Files prepared in $artifactsDir"
        shell: powershell
      - name: Extract public certificate
        run: |
          $artifactsDir = "windows-artifacts"
          $pfxPath = "$artifactsDir/vardyparty.pfx"
          $cerPath = "$artifactsDir/vardyparty.cer"
          $password = ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERT_PASSWORD }}" -Force -AsPlainText
          
          # Load the certificate
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import($pfxPath, $password, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet)
          
          # Export public certificate
          $certBytes = $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert)
          [System.IO.File]::WriteAllBytes($cerPath, $certBytes)
          
          Write-Host "Public certificate extracted to $cerPath"
        shell: powershell
      - name: Copy AppxManifest and create integrity manifest
        run: |
          $artifactsDir = "windows-artifacts"
          $manifestPath = "VardyParty/bin/Release/net10.0-windows10.0.19041.0/win-x64/AppPackages"
          
          # Copy AppxManifest.xml
          Get-ChildItem -Path $manifestPath -Filter "AppxManifest.xml" -Recurse | ForEach-Object {
            Copy-Item $_.FullName "$artifactsDir/AppxManifest.xml" -Force
          }
          
          # Create integrity manifest with SHA256 hashes
          $hashManifest = @()
          $hashManifest += "# VardyParty Windows Package Integrity Manifest"
          $hashManifest += "# Generated: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          $hashManifest += ""
          
          Get-ChildItem -Path $artifactsDir -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            $hashManifest += "$($_.Name): $hash"
            Write-Host "SHA256($($_.Name)): $hash"
          }
          
          $hashManifest | Out-File -FilePath "$artifactsDir/INTEGRITY.txt" -Encoding UTF8
          Write-Host "Integrity manifest created"
        shell: powershell
      - name: Create installation instructions
        run: |
          $artifactsDir = "windows-artifacts"
          $instructions = @'
# VardyParty Windows Installation Guide

This package contains everything needed to install VardyParty on Windows 10+.

## Package Contents

- **VardyParty-windows.msix** - The application installer
- **vardyparty.pfx** - Self-signed certificate (password protected)
- **vardyparty.cer** - Public certificate (for viewing/verification)
- **AppxManifest.xml** - Package metadata and configuration
- **install.ps1** - Automated installation script (recommended)
- **INTEGRITY.txt** - SHA256 hashes for file verification
- **WINDOWS_INSTALL.md** - This file

## Installation Methods

### Method 1: Automated Installation (Recommended)

1. Right-click `install.ps1` and select "Run with PowerShell"
   - Alternatively, open PowerShell as Administrator and run: `.\install.ps1`
2. Follow the prompts
3. When prompted for the certificate password, enter: `P@ssw0rd!`
4. The script will automatically install the certificate and MSIX

### Method 2: Manual Installation

#### Step 1: Install the Certificate
1. Open PowerShell as Administrator
2. Run:
   ```powershell
   $password = ConvertTo-SecureString -String "P@ssw0rd!" -Force -AsPlainText
   Import-PfxCertificate -FilePath "vardyparty.pfx" -CertStoreLocation "Cert:\CurrentUser\My" -Password $password
   ```

#### Step 2: Install the MSIX
1. Double-click `VardyParty-windows.msix`, or
2. Use PowerShell:
   ```powershell
   Add-AppxPackage -Path "VardyParty-windows.msix"
   ```

## Verification

To verify file integrity before installation:

```powershell
Get-FileHash -Path "VardyParty-windows.msix" -Algorithm SHA256
Get-FileHash -Path "vardyparty.pfx" -Algorithm SHA256
```

Compare the output with the hashes in `INTEGRITY.txt`.

## Certificate Information

This package uses a **self-signed certificate** for testing purposes only. 

To view certificate details:
- Double-click `vardyparty.cer` and select "View Certificate", or
- Right-click `vardyparty.pfx` and select "Properties"

**⚠️ Security Note:** Self-signed certificates should only be used for testing/development. For production distribution, obtain a code-signing certificate from a trusted Certificate Authority.

## Troubleshooting

### "Administrator rights required" error
- Ensure you're running PowerShell as Administrator
- Right-click PowerShell → "Run as administrator"

### Certificate installation fails
- Verify the password is correct: `P@ssw0rd!`
- Ensure you have administrator privileges
- Try the manual method above

### MSIX installation fails
- Ensure the certificate is installed first
- Try uninstalling any previous version first
- Run `Get-AppxPackage VardyParty*` to check current state

### Windows Protected Your PC warning
- This is normal for self-signed certificates
- Click "More info" → "Run anyway"

## Uninstalling

To uninstall VardyParty:
```powershell
Remove-AppxPackage -Package VardyParty_*
```

## Support

For issues or questions, please refer to the main repository documentation or open an issue on GitHub.
'@
          $instructions | Out-File -FilePath "$artifactsDir/WINDOWS_INSTALL.md" -Encoding UTF8
          Write-Host "Installation instructions created"
        shell: powershell
      - name: Create installation script
        run: |
          $artifactsDir = "windows-artifacts"
          $script = @'
# VardyParty Windows Installation Script
# This script automates certificate installation and MSIX package deployment
# Requires: PowerShell (Windows 10+), Administrator privileges

param(
    [string]$CertPassword = "P@ssw0rd!",
    [string]$CertPath = "vardyparty.pfx",
    [string]$MsixPath = "VardyParty-windows.msix"
)

function Write-Header {
    param([string]$Message)
    Write-Host ""
    Write-Host "=" * 60
    Write-Host $Message
    Write-Host "=" * 60
}

function Test-AdminRights {
    $currentUser = [Security.Principal.WindowsIdentity]::GetCurrent()
    $principal = New-Object Security.Principal.WindowsPrincipal($currentUser)
    return $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
}

# Check for admin privileges
Write-Header "VardyParty Windows Installer"
if (-not (Test-AdminRights)) {
    Write-Host "ERROR: This script requires Administrator privileges."
    Write-Host "Please run PowerShell as Administrator and try again."
    exit 1
}

# Verify files exist
Write-Host "Verifying installation files..."
if (-not (Test-Path $CertPath)) {
    Write-Host "ERROR: Certificate file not found: $CertPath"
    exit 1
}
if (-not (Test-Path $MsixPath)) {
    Write-Host "ERROR: MSIX package not found: $MsixPath"
    exit 1
}
Write-Host "✓ All required files found"

# Install certificate
Write-Header "Installing Certificate"
Write-Host "Installing self-signed certificate..."
try {
    $securePassword = ConvertTo-SecureString -String $CertPassword -Force -AsPlainText
    $cert = Import-PfxCertificate -FilePath $CertPath `
        -CertStoreLocation "Cert:\CurrentUser\My" `
        -Password $securePassword `
        -ErrorAction Stop
    
    if ($cert) {
        Write-Host "✓ Certificate installed successfully"
        Write-Host "  Subject: $($cert.Subject)"
        Write-Host "  Thumbprint: $($cert.Thumbprint)"
    }
} catch {
    Write-Host "ERROR: Failed to install certificate"
    Write-Host "Details: $($_.Exception.Message)"
    exit 1
}

# Install MSIX package
Write-Header "Installing VardyParty Application"
Write-Host "Installing MSIX package..."
try {
    $msixFile = Resolve-Path $MsixPath
    Add-AppxPackage -Path $msixFile.Path -ErrorAction Stop
    Write-Host "✓ Application installed successfully"
} catch {
    Write-Host "ERROR: Failed to install MSIX package"
    Write-Host "Details: $($_.Exception.Message)"
    Write-Host ""
    Write-Host "If you see 'Administrator rights required', the certificate may not be trusted."
    Write-Host "Try installing the certificate first, then the MSIX package."
    exit 1
}

# Verify installation
Write-Header "Verification"
$installed = Get-AppxPackage -Name "*VardyParty*" -ErrorAction SilentlyContinue
if ($installed) {
    Write-Host "✓ VardyParty is now installed!"
    Write-Host "  Name: $($installed.Name)"
    Write-Host "  Version: $($installed.Version)"
    Write-Host ""
    Write-Host "You can now launch VardyParty from the Start Menu or by running:"
    Write-Host "  explorer.exe shell:appsFolder\$($installed.PackageFamilyName)!App"
} else {
    Write-Host "WARNING: Could not verify installation"
}

Write-Header "Installation Complete"
Write-Host "Thank you for installing VardyParty!"
'@
          $script | Out-File -FilePath "$artifactsDir/install.ps1" -Encoding UTF8
          Write-Host "Installation script created"
        shell: powershell
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: ./windows-artifacts
          retention-days: 30

  package-android:
    name: Package Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: dotnet workload install maui-android --ignore-failed-sources
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Download Android build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Publish Android app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net10.0-android -c Release -p:RunGenerateBuildInfo=true -p:RunGenerateSplash=true
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: ./VardyParty/bin/Release/net10.0-android/*.apk
          retention-days: 30

  package-ios:
    name: Package iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install ios --ignore-failed-sources
      - name: Download iOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-ios
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Publish iOS app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net10.0-ios -c Release
      - name: Create iOS package
        run: tar -czf VardyParty-ios.tar.gz -C VardyParty/bin/Release/net10.0-ios/ios-arm64 .
      - name: Upload iOS package
        uses: actions/upload-artifact@v4
        with:
          name: ios-package
          path: ./VardyParty-ios.tar.gz
          retention-days: 30

  package-macos:
    name: Package macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install maccatalyst --ignore-failed-sources
      - name: Download macOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-macos
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore ${{ env.VARDYPARTY_CSPROJ }}
      - name: Publish macOS app
        run: dotnet publish ${{ env.VARDYPARTY_CSPROJ }} -f net10.0-maccatalyst -c Release
      - name: Create macOS package
        run: tar -czf VardyParty-macos.tar.gz -C VardyParty/bin/Release/net10.0-maccatalyst/maccatalyst-arm64 .
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: ./VardyParty-macos.tar.gz
          retention-days: 30

  package-linux-x64:
    name: Package Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Download Linux x64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-linux-x64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore VardyParty.Core/VardyParty.Core.csproj
      - name: Publish Linux x64 library
        run: dotnet publish VardyParty.Core/VardyParty.Core.csproj -f net10.0 -r linux-x64 -c Release
      - name: Create Linux x64 package
        run: tar -czf VardyParty-linux-x64.tar.gz -C VardyParty.Core/bin/Release/net10.0/linux-x64 .
      - name: Upload Linux x64 package
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-package
          path: ./VardyParty-linux-x64.tar.gz
          retention-days: 30

  package-linux-arm64:
    name: Package Linux ARM64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Download Linux ARM64 build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-linux-arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CI_RUN_ID }}
      - name: Restore dependencies
        run: dotnet restore VardyParty.Core/VardyParty.Core.csproj
      - name: Publish Linux ARM64 library
        run: dotnet publish VardyParty.Core/VardyParty.Core.csproj -f net10.0 -r linux-arm64 -c Release
      - name: Create Linux ARM64 package
        run: tar -czf VardyParty-linux-arm64.tar.gz -C VardyParty.Core/bin/Release/net10.0/linux-arm64 .
      - name: Upload Linux ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-package
          path: ./VardyParty-linux-arm64.tar.gz
          retention-days: 30