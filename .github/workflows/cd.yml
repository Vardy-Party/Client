  package-linux-x64:
    name: Package Linux x64 Snap
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      HomeUiTargetFrameworks: net11.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.package_sha || github.sha }}
      - name: Apply packaged ApplicationVersion
        if: ${{ github.event.inputs.application_version != '' }}
        shell: bash
        env:
          APPLICATION_VERSION: ${{ github.event.inputs.application_version }}
        run: |
          set -euo pipefail
          sed -i.bak "s/<ApplicationVersion>[0-9]*<\/ApplicationVersion>/<ApplicationVersion>${APPLICATION_VERSION}<\/ApplicationVersion>/" Version.props
          rm -f Version.props.bak
          echo "Packaging ApplicationVersion=${APPLICATION_VERSION}"
      - name: Setup .NET 11 preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
          source-url: https://nuget.pkg.github.com/Vardy-Party/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_READ_TOKEN }}
      - name: Install MAUI workload (plain-TFM MAUI SDK on Linux)
        run: dotnet workload install maui-tizen --ignore-failed-sources
      - name: Restore dependencies
        run: dotnet restore VardyParty.Desktop/VardyParty.Desktop.csproj --ignore-failed-sources
      - name: Generate appsettings.json for Linux
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENTID: ${{ secrets.AUTH0_CLIENTID }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          AUTH0_SCOPE: ${{ secrets.AUTH0_SCOPE }}
          AUTH0_CALLBACKSCHEME: ${{ secrets.AUTH0_CALLBACKSCHEME }}
          AUTH0_REDIRECTURI: ${{ secrets.AUTH0_REDIRECTURI }}
          AUTH0_POSTLOGOUTREDIRECTURI: ${{ secrets.AUTH0_POSTLOGOUTREDIRECTURI }}
          AUTH0_TOKENLEEAWAYSECONDS: ${{ secrets.AUTH0_TOKENLEEAWAYSECONDS }}
          AUTH0_REQUIREDROLECLAIMTYPE: ${{ secrets.AUTH0_REQUIREDROLECLAIMTYPE }}
          AUTH0_REQUIREDROLE: ${{ secrets.AUTH0_REQUIREDROLE }}
          API_HEADLESSBASEURL: ${{ secrets.API_HEADLESSBASEURL }}
        run: |
          chmod +x scripts/merge-appsettings-secrets.sh
          scripts/merge-appsettings-secrets.sh VardyParty.Desktop/appsettings.json
          if grep -q "AllowUserSecrets" VardyParty.Desktop/appsettings.json; then
            echo "ERROR: AllowUserSecrets found in Linux appsettings.json"
            exit 1
          fi
          echo "OK: Linux appsettings enriched from Actions secrets"
        shell: bash
      - name: Publish Linux x64 application
        run: dotnet publish VardyParty.Desktop/VardyParty.Desktop.csproj -f net11.0 -r linux-x64 -c Release --self-contained true -p:PublishSingleFile=false
      - name: Verify Linux icon exists
        run: |
          ICON_PATH="VardyParty.Desktop/Assets/vardyparty.svg"
          if [ ! -f "$ICON_PATH" ]; then
            echo "ERROR: Linux icon not found at $ICON_PATH"
            exit 1
          fi
          echo "OK: Linux icon found at $ICON_PATH"
      - name: Generate snapcraft.yaml (x64)
        id: snap_version
        run: |
          SNAP_VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\([^<]*\)</ApplicationDisplayVersion>.*:\1:p' Version.props | head -n 1)
          SNAP_BUILD=$(sed -n 's:.*<ApplicationVersion>\([^<]*\)</ApplicationVersion>.*:\1:p' Version.props | head -n 1)
          if [ -z "$SNAP_VERSION" ]; then
            echo "ERROR: <ApplicationDisplayVersion> not found in Version.props"
            exit 1
          fi
          if [ -z "$SNAP_BUILD" ]; then
            echo "ERROR: <ApplicationVersion> not found in Version.props"
            exit 1
          fi

          SNAP_FULL_VERSION="${SNAP_VERSION}+${SNAP_BUILD}"
          echo "SNAP_VERSION=$SNAP_VERSION" >> "$GITHUB_ENV"
          echo "SNAP_BUILD=$SNAP_BUILD" >> "$GITHUB_ENV"
          echo "SNAP_FULL_VERSION=$SNAP_FULL_VERSION" >> "$GITHUB_ENV"
          echo "display=$SNAP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$SNAP_BUILD" >> "$GITHUB_OUTPUT"
          echo "full=$SNAP_FULL_VERSION" >> "$GITHUB_OUTPUT"

          cat > snapcraft.yaml << 'EOF'
          name: vardyparty
          title: Vardy Party
          base: core24
          version: '__SNAP_VERSION__'
          summary: Vardy Party Linux client
          description: Vardy Party desktop client packaged as a Snap.
          grade: devel
          confinement: classic
          platforms:
            amd64:

          parts:
            app:
              plugin: dump
              source: VardyParty.Desktop/bin/Release/net11.0/linux-x64/publish
              override-build: |
                craftctl default
                mkdir -p "$CRAFT_PART_INSTALL/meta/gui"
                cat > "$CRAFT_PART_INSTALL/meta/gui/vardyparty.desktop" << 'DESKTOP'
                [Desktop Entry]
                Name=Vardy Party
                Comment=Vardy Party Linux client
                Exec=vardyparty
                Icon=${SNAP}/meta/gui/vardyparty.svg
                Terminal=false
                Type=Application
                Categories=AudioVideo;Video;
                DESKTOP
                cp "$CRAFT_PROJECT_DIR/VardyParty.Desktop/Assets/vardyparty.svg" "$CRAFT_PART_INSTALL/meta/gui/vardyparty.svg"
                mkdir -p "$CRAFT_PART_INSTALL/bin"
                cat > "$CRAFT_PART_INSTALL/bin/vardyparty-wrapper" << 'WRAPPER'
                #!/bin/bash
                export LD_LIBRARY_PATH="$SNAP/usr/lib:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/lib:$SNAP/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/pulseaudio:$LD_LIBRARY_PATH"
                export VLC_PLUGIN_PATH="$SNAP/usr/lib/x86_64-linux-gnu/vlc/plugins"
                exec $SNAP/VardyPartyDesktop "$@"
                WRAPPER
                chmod +x "$CRAFT_PART_INSTALL/bin/vardyparty-wrapper"
              stage-packages:
                - libvlc5
                - libvlccore9
                - vlc-plugin-base
                - vlc-plugin-video-splitter
                - vlc-plugin-video-output
                - vlc-l10n
                - libavcodec60
                - libavformat60
                - libavutil58
                - libswscale7
                - libswresample4
                - libtheora0
                - libopus0
                - libvorbis0a
                - libvorbisenc2
                - libpulse0
                - libice6
                - libsm6
                - libx11-6
                - libxkbcommon0
                - libxcursor1
                - libxinerama1
                - libxrandr2
                - libxrender1
                - libxext6
                - libxft2
                - fontconfig-config
                - fonts-dejavu-core
                - libicu74
              prime:
                - -usr/share/doc
                - -usr/share/man

          apps:
            vardyparty:
              command: bin/vardyparty-wrapper
              desktop: meta/gui/vardyparty.desktop
              environment:
                LD_LIBRARY_PATH: $SNAP/usr/lib:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/lib:$SNAP/lib/x86_64-linux-gnu
              plugs:
                - network
                - network-bind
                - home
                - audio-playback
                - opengl
                - wayland
                - x11
          EOF
          sed -i "s/__SNAP_VERSION__/$SNAP_FULL_VERSION/" snapcraft.yaml
          echo "Using snap version: $SNAP_FULL_VERSION"
      - name: Validate generated snapcraft.yaml (x64)
        run: |
          echo "Generated snapcraft.yaml (x64):"
          cat snapcraft.yaml
          if grep -q '^\s*architectures:' snapcraft.yaml; then
            echo "ERROR: Invalid key 'architectures' found for core24 snapcraft.yaml"
            exit 1
          fi
          if ! grep -q '^\s*platforms:' snapcraft.yaml; then
            echo "ERROR: Required key 'platforms' missing from snapcraft.yaml"
            exit 1
          fi
      - name: Build Linux x64 snap
        id: snapcraft_build
        uses: snapcore/action-build@v1
      - name: Rename Linux x64 snap package
        run: |
          SNAP_FILE="${{ steps.snapcraft_build.outputs.snap }}"
          OUTPUT_FILE="$GITHUB_WORKSPACE/VardyParty-linux-x64-v${SNAP_VERSION}+${SNAP_BUILD}.snap"
          mv "$SNAP_FILE" "$OUTPUT_FILE"
          ls -lh "$OUTPUT_FILE"
      - name: Verify Linux x64 snap exists
        run: |
          OUTPUT_PATH="$GITHUB_WORKSPACE/VardyParty-linux-x64-v${SNAP_VERSION}+${SNAP_BUILD}.snap"
          if [ ! -f "$OUTPUT_PATH" ]; then
            echo "ERROR: Linux x64 snap not found at $OUTPUT_PATH"
            exit 1
          fi
          echo "OK: Linux x64 snap found at $OUTPUT_PATH"
      - name: Upload Linux x64 package
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-package-v${{ steps.snap_version.outputs.full }}
          path: ${{ github.workspace }}/VardyParty-linux-x64-v*+*.snap
          retention-days: 30
      - name: Publish Linux x64 package as Release asset
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.produce_release_assets == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: "VardyParty v${{ steps.snap_version.outputs.display }}-b${{ steps.snap_version.outputs.build }}"
          RELEASE_TAG: "${{ steps.snap_version.outputs.display }}-b${{ steps.snap_version.outputs.build }}"
        run: |
          set -e
          PACKAGE_FILE=$(ls $GITHUB_WORKSPACE/VardyParty-linux-x64-v*+*.snap | head -1)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_FILE" --title "$RELEASE_NAME" --notes "Automated package release for $RELEASE_NAME" || gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" --clobber
          fi
        shell: bash

