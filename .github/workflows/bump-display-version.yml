name: Bump Display Version

# Semver (ApplicationDisplayVersion) is a release decision — never auto-bump on PRs.
# Run manually from Actions when you want major/minor/patch. After the bump
# lands on main, this workflow dispatches CD so the GitHub release uses the
# new display version (product-merge CI still has the old Version.props).
#
# ApplicationVersion on a product PR is set on the feature branch. Tick
# bump_build_number here only when you want another build number with the
# display bump.
on:
  workflow_dispatch:
    inputs:
      version_bump_type:
        description: 'ApplicationDisplayVersion bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch
      bump_build_number:
        description: 'Also increment ApplicationVersion by 1'
        required: false
        default: true
        type: boolean

concurrency:
  group: bump-display-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump-display-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current version
        id: read-version
        run: |
          BUILD_VERSION=$(grep -oP '(?<=<ApplicationVersion>)\K[^<]+(?=</ApplicationVersion>)' Version.props)
          DISPLAY_VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>)\K[^<]+(?=</ApplicationDisplayVersion>)' Version.props)
          echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "display_version=${DISPLAY_VERSION}" >> $GITHUB_OUTPUT

      - name: Parse and bump versions
        id: bump-version
        run: |
          BUILD_VERSION="${{ steps.read-version.outputs.build_version }}"
          DISPLAY_VERSION="${{ steps.read-version.outputs.display_version }}"
          BUMP_TYPE="${{ github.event.inputs.version_bump_type }}"
          BUMP_BUILD="${{ github.event.inputs.bump_build_number }}"

          if [[ "${BUMP_BUILD}" == "true" ]]; then
            NEW_BUILD_VERSION=$((BUILD_VERSION + 1))
          else
            NEW_BUILD_VERSION="${BUILD_VERSION}"
          fi

          IFS='.' read -ra VERSION_PARTS <<< "$DISPLAY_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]:-0}

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_DISPLAY_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "build_version=${NEW_BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "display_version=${NEW_DISPLAY_VERSION}" >> $GITHUB_OUTPUT
          echo "::notice::ApplicationVersion ${BUILD_VERSION} → ${NEW_BUILD_VERSION}"
          echo "::notice::ApplicationDisplayVersion ${DISPLAY_VERSION} → ${NEW_DISPLAY_VERSION} (${BUMP_TYPE})"

      - name: Update Version.props
        run: |
          sed -i "s/<ApplicationVersion>[^<]*<\/ApplicationVersion>/<ApplicationVersion>${{ steps.bump-version.outputs.build_version }}<\/ApplicationVersion>/" Version.props
          sed -i "s/<ApplicationDisplayVersion>[^<]*<\/ApplicationDisplayVersion>/<ApplicationDisplayVersion>${{ steps.bump-version.outputs.display_version }}<\/ApplicationDisplayVersion>/" Version.props

      - name: Commit, open PR, and squash-merge to main
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ steps.bump-version.outputs.build_version }}
          DISPLAY_VERSION: ${{ steps.bump-version.outputs.display_version }}
        run: |
          set -euo pipefail

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          BRANCH="ci/bump-display-version-${DISPLAY_VERSION}-b${BUILD_VERSION}"
          TITLE="ci: bump ApplicationVersion to ${BUILD_VERSION} and ApplicationDisplayVersion to ${DISPLAY_VERSION}"
          BODY="Automated display-version bump from workflow_dispatch.

          main is protected (GH006: changes must be made through a pull request), so this workflow cannot push directly. Squash-merging this PR lands the new versions on main."

          git checkout -B "$BRANCH"
          git add Version.props
          git commit -m "$TITLE"
          git push --force-with-lease origin "HEAD:${BRANCH}"

          PR_NUMBER=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "${PR_NUMBER}" ]]; then
            if ! PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"); then
              echo "::error::Could not create the version-bump PR. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', then re-run this workflow."
              exit 1
            fi
            echo "::notice::Opened ${PR_URL}"
          else
            echo "::notice::Reusing existing PR #${PR_NUMBER}"
          fi

          if ! gh pr merge --squash --delete-branch --subject "$TITLE"; then
            echo "::error::Opened a version-bump PR but could not squash-merge it onto main. If required status checks or reviews block github-actions[bot], allow that actor to bypass those rules for this path, or merge the PR manually."
            exit 1
          fi

          echo "::notice::ApplicationDisplayVersion ${DISPLAY_VERSION} (build ${BUILD_VERSION}) is on main"

          PACKAGE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          chmod +x scripts/dispatch-cd-for-release.sh
          scripts/dispatch-cd-for-release.sh "${PACKAGE_SHA}" "${BUILD_VERSION}"
