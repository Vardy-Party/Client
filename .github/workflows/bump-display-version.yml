name: Bump Display Version

# Semver (ApplicationDisplayVersion) is a release decision — never auto-bump on PRs.
# Run manually from Actions when you want major/minor/patch.
#
# ApplicationVersion (build counter) is incremented on successful CI for main
# by "Increment Build Version" — not here, unless you also tick bump_build_number.
on:
  workflow_dispatch:
    inputs:
      version_bump_type:
        description: 'ApplicationDisplayVersion bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch
      bump_build_number:
        description: 'Also increment ApplicationVersion by 1'
        required: false
        default: true
        type: boolean

concurrency:
  group: bump-display-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-display-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current version
        id: read-version
        run: |
          BUILD_VERSION=$(grep -oP '(?<=<ApplicationVersion>)\K[^<]+(?=</ApplicationVersion>)' Version.props)
          DISPLAY_VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>)\K[^<]+(?=</ApplicationDisplayVersion>)' Version.props)
          echo "build_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "display_version=${DISPLAY_VERSION}" >> $GITHUB_OUTPUT

      - name: Parse and bump versions
        id: bump-version
        run: |
          BUILD_VERSION="${{ steps.read-version.outputs.build_version }}"
          DISPLAY_VERSION="${{ steps.read-version.outputs.display_version }}"
          BUMP_TYPE="${{ github.event.inputs.version_bump_type }}"
          BUMP_BUILD="${{ github.event.inputs.bump_build_number }}"

          if [[ "${BUMP_BUILD}" == "true" ]]; then
            NEW_BUILD_VERSION=$((BUILD_VERSION + 1))
          else
            NEW_BUILD_VERSION="${BUILD_VERSION}"
          fi

          IFS='.' read -ra VERSION_PARTS <<< "$DISPLAY_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]:-0}

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_DISPLAY_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "build_version=${NEW_BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "display_version=${NEW_DISPLAY_VERSION}" >> $GITHUB_OUTPUT
          echo "::notice::ApplicationVersion ${BUILD_VERSION} → ${NEW_BUILD_VERSION}"
          echo "::notice::ApplicationDisplayVersion ${DISPLAY_VERSION} → ${NEW_DISPLAY_VERSION} (${BUMP_TYPE})"

      - name: Update Version.props
        run: |
          sed -i "s/<ApplicationVersion>[^<]*<\/ApplicationVersion>/<ApplicationVersion>${{ steps.bump-version.outputs.build_version }}<\/ApplicationVersion>/" Version.props
          sed -i "s/<ApplicationDisplayVersion>[^<]*<\/ApplicationDisplayVersion>/<ApplicationDisplayVersion>${{ steps.bump-version.outputs.display_version }}<\/ApplicationDisplayVersion>/" Version.props

      - name: Commit and push version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add Version.props
          git commit -m "ci: bump ApplicationVersion to ${{ steps.bump-version.outputs.build_version }} and ApplicationDisplayVersion to ${{ steps.bump-version.outputs.display_version }}"
          git push origin main
