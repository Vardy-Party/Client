name: Bump Display Version

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  bump-display-version:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current version
        id: read-version
        run: |
          DISPLAY_VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>)\K[^<]+(?=</ApplicationDisplayVersion>)' Version.props)
          echo "current_version=${DISPLAY_VERSION}" >> $GITHUB_OUTPUT

      - name: Parse and bump version
        id: bump-version
        run: |
          CURRENT="${{ steps.read-version.outputs.current_version }}"
          BUMP_TYPE="${{ github.event.inputs.version_bump_type || 'patch' }}"
          
          # Parse version (e.g., 1.7.2 -> major=1, minor=7, patch=2)
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]:-0}
          
          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "::notice::Bumped ApplicationDisplayVersion from ${CURRENT} to ${NEW_VERSION} (${BUMP_TYPE})"

      - name: Update Version.props
        run: |
          sed -i "s/<ApplicationDisplayVersion>[^<]*<\/ApplicationDisplayVersion>/<ApplicationDisplayVersion>${{ steps.bump-version.outputs.new_version }}<\/ApplicationDisplayVersion>/" Version.props

      - name: Commit and push version update
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add Version.props
          git commit -m "ci: bump ApplicationDisplayVersion to ${{ steps.bump-version.outputs.new_version }}"
          git push origin HEAD:${{ github.head_ref || github.ref }}
