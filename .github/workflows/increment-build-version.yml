name: Increment Build Version

# After CI succeeds on main for a *product* commit, allocate a unique
# ApplicationVersion and kick off CD so that merge is packaged under that number.
#
# Chain: merge to main → CI (not cancelled) → this workflow (serialized) →
#   bump PR (GH006: no direct push to main) → dispatch CD with the new version.
#
# Why not "CI complete → CD and increment in parallel"?
# CD would read Version.props before the bump PR lands, so two merges share
# e.g. 149. GITHUB_TOKEN squash-merges also do not re-trigger CI/CD, so the
# bumped number would only be used on a later merge — or never, if the bump
# PR cannot merge (branch protection).
#
# Loop guard: skip when the *triggering CI commit* (not whatever HEAD is now)
# is already a version commit. Checking HEAD would drop a second fast merge
# after the first bump PR landed. Two increments are serialized by concurrency
# and take max(Version.props, open bump PRs)+1 so versions stay unique even
# when a previous bump PR is still open.
#
# Bump still goes through a PR (no git push to protected main). If the bot
# cannot squash-merge (reviews / required checks / auto-merge disabled), the
# PR is left open and CD still packages this unique version. Merge the bump
# PR so main's Version.props catches up.
on:
  workflow_run:
    workflows:
      - "CI - Build & Test"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: increment-build-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  increment-build-version:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      PACKAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip bot re-entry
        id: guard
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${TRIGGER_SHA}" ]]; then
            git fetch --depth=1 origin "${TRIGGER_SHA}"
            MSG=$(git log -1 --pretty=%s "${TRIGGER_SHA}")
          else
            MSG=$(git log -1 --pretty=%s)
          fi
          if [[ "${MSG}" == ci:\ bump* || "${MSG}" == ci:\ auto-increment* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping — triggering commit is already a version commit (${MSG})"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Increment ApplicationVersion
        if: ${{ steps.guard.outputs.skip != 'true' }}
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP '(?<=<ApplicationVersion>)\d+(?=</ApplicationVersion>)' Version.props)
          if [[ -z "${CURRENT}" ]]; then
            echo "::error::Could not read ApplicationVersion from Version.props"
            exit 1
          fi

          PENDING=$(gh pr list --base main --state open --json title --jq '
            [
              .[].title
              | select(test("ci: auto-increment ApplicationVersion to [0-9]+$"))
              | capture("to (?<n>[0-9]+)$")
              | .n
              | tonumber
            ] | max // 0
          ')
          BASE="${CURRENT}"
          if [[ -n "${PENDING}" && "${PENDING}" -gt "${CURRENT}" ]]; then
            BASE="${PENDING}"
          fi
          NEW_VERSION=$((BASE + 1))
          sed -i "s/<ApplicationVersion>[0-9]*<\/ApplicationVersion>/<ApplicationVersion>${NEW_VERSION}<\/ApplicationVersion>/" Version.props
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Allocated ApplicationVersion ${CURRENT} (pending PR max ${PENDING}) → ${NEW_VERSION}"

      - name: Commit, open PR, and try to squash-merge
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          BRANCH="ci/increment-application-version-${NEW_VERSION}"
          TITLE="ci: auto-increment ApplicationVersion to ${NEW_VERSION}"
          BODY="Automated ApplicationVersion bump after CI succeeded on main.

          This reserves build ${NEW_VERSION} for the package of that CI run. CD is dispatched with this number even if branch protection blocks the bot from merging.

          main is protected (GH006: changes must be made through a pull request), so this workflow cannot push directly. Please squash-merge this PR so Version.props on main matches the packaged release.

          GITHUB_TOKEN merges do not re-trigger workflows, so this does not loop CI/CD."

          git checkout -B "$BRANCH"
          git add Version.props
          git commit -m "$TITLE"
          git push --force-with-lease origin "HEAD:${BRANCH}"

          PR_NUMBER=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "${PR_NUMBER}" ]]; then
            if ! PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"); then
              echo "::error::Could not create the version-bump PR. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', then re-run this workflow."
              exit 1
            fi
            echo "::notice::Opened ${PR_URL}"
          else
            echo "::notice::Reusing existing PR #${PR_NUMBER}"
          fi

          # Squash keeps the ci: auto-increment* subject so the skip guard still matches.
          # Do not fail the job if protection blocks the merge — CD still uses NEW_VERSION.
          if gh pr merge --squash --delete-branch --subject "$TITLE"; then
            echo "::notice::ApplicationVersion ${NEW_VERSION} is on main"
          elif gh pr merge --squash --auto --delete-branch --subject "$TITLE"; then
            echo "::warning::Enabled auto-merge for the version-bump PR. Merge it (or wait for checks) so main's Version.props catches up. Packaging will still use ${NEW_VERSION}."
          else
            echo "::warning::Opened a version-bump PR but could not squash-merge it onto main. If required status checks or reviews block github-actions[bot], allow that actor to bypass those rules for Version.props, enable auto-merge, or merge the PR manually. Packaging will still use ApplicationVersion ${NEW_VERSION}."
          fi

      - name: Dispatch CD for this unique version
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_RUN_ID}" ]]; then
            echo "::warning::No CI run id (workflow_dispatch without a triggering CI). Skipping CD. Run 'CD - Package & Release' manually with ci_run_id and application_version=${NEW_VERSION}."
            exit 0
          fi
          gh workflow run "CD - Package & Release" --ref main \
            -f ci_run_id="${CI_RUN_ID}" \
            -f produce_release_assets=true \
            -f application_version="${NEW_VERSION}" \
            -f package_sha="${PACKAGE_SHA}"
          echo "::notice::Dispatched CD for ApplicationVersion ${NEW_VERSION} (CI ${CI_RUN_ID}, sha ${PACKAGE_SHA})"
