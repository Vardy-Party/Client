name: Increment Build Version

# After CI succeeds on main for a *product* commit, package that commit only
# when ApplicationDisplayVersion is newer than the latest GitHub release.
# Otherwise CD would publish another 2.0.0-bN and --clobber that line.
# Display bumps are released by "Bump Display Version" (not here): main CI
# skips `ci: bump*` commits, so this workflow never sees them.
#
# ApplicationVersion is set on the feature branch so it lands with the PR.
# If Version.props on the merge is still behind published -bN tags, package
# last-release+1 (does not rewrite main).
on:
  workflow_run:
    workflows:
      - "CI - Build & Test"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: increment-build-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  increment-build-version:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      CI_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      PACKAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout the merge being packaged
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Skip bot re-entry
        id: guard
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${TRIGGER_SHA}" ]]; then
            MSG=$(git log -1 --pretty=%s "${TRIGGER_SHA}")
          else
            MSG=$(git log -1 --pretty=%s)
          fi
          if [[ "${MSG}" == ci:\ bump* || "${MSG}" == ci:\ auto-increment* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping — triggering commit is already a version commit (${MSG})"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve ApplicationVersion
        if: ${{ steps.guard.outputs.skip != 'true' }}
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/sync-application-version.sh
          COMMIT_V=$(sed -n 's/.*<ApplicationVersion>\([0-9][0-9]*\)<\/ApplicationVersion>.*/\1/p' Version.props | head -n 1)
          RELEASED=$(gh release list --limit 50 --json tagName --jq '
            [
              .[].tagName
              | capture("-b(?<n>[0-9]+)$")
              | .n
              | tonumber
            ] | max // 0
          ')
          RELEASED="${RELEASED:-0}"
          if [[ "${COMMIT_V}" -gt "${RELEASED}" ]]; then
            USE="${COMMIT_V}"
          else
            USE=$((RELEASED + 1))
            echo "::warning::Version.props on this commit is ${COMMIT_V}, latest release is b${RELEASED}. Packaging ${USE}."
          fi
          echo "new_version=${USE}" >> "$GITHUB_OUTPUT"
          echo "::notice::Packaging ApplicationVersion ${USE} (commit ${COMMIT_V}, released max ${RELEASED})"

          COMMIT_D=$(sed -n 's/.*<ApplicationDisplayVersion>\([^<]*\)<\/ApplicationDisplayVersion>.*/\1/p' Version.props | head -n 1)
          LAST_D=$(gh release list --limit 1 --json tagName --jq '((.[0] // {}).tagName // "") | split("-b")[0]')
          echo "display=${COMMIT_D}" >> "$GITHUB_OUTPUT"
          if [[ -n "${LAST_D}" && "${COMMIT_D}" == "${LAST_D}" ]]; then
            echo "same_display=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Display version ${COMMIT_D} already has a GitHub release. Skipping CD so a new ${COMMIT_D}-b${USE} cannot clobber that line. Run Actions → Bump Display Version, which dispatches CD."
          else
            echo "same_display=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch CD for this unique version
        if: ${{ steps.guard.outputs.skip != 'true' && steps.version.outputs.same_display != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_RUN_ID}" ]]; then
            echo "::warning::No CI run id (workflow_dispatch without a triggering CI). Skipping CD. Run 'CD - Package & Release' manually with ci_run_id and application_version=${NEW_VERSION}."
            exit 0
          fi
          gh workflow run "CD - Package & Release" --ref main \
            -f ci_run_id="${CI_RUN_ID}" \
            -f produce_release_assets=true \
            -f application_version="${NEW_VERSION}" \
            -f package_sha="${PACKAGE_SHA}"
          echo "::notice::Dispatched CD for ApplicationVersion ${NEW_VERSION} (CI ${CI_RUN_ID}, sha ${PACKAGE_SHA})"
