name: Release - Build & Package

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

  build-windows-release:
    name: Build & Package Windows (APPX)
    runs-on: windows-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Publish Windows app
        run: dotnet publish VardyParty/VardyParty.csproj -c Release -f net10.0-windows10.0.19041.0 /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true -o ./output/windows
      
      - name: Package Windows
        run: |
          cd output/windows
          7z a -tzip "VardyParty-windows-${{ github.ref_name }}.zip" *
          cd ../..
      
      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./output/windows/VardyParty-windows-${{ github.ref_name }}.zip
          asset_name: VardyParty-windows-${{ github.ref_name }}.zip
          asset_content_type: application/zip

  build-android-release:
    name: Build & Package Android (APK)
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Publish Android app
        run: dotnet publish VardyParty/VardyParty.csproj -c Release -f net10.0-android /p:AndroidPackageFormat=apk -o ./output/android
      
      - name: Upload Android Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./output/android/com.vardyparty-Signed.apk
          asset_name: VardyParty-android-${{ github.ref_name }}.apk
          asset_content_type: application/vnd.android.package-archive

  build-ios-release:
    name: Build & Package iOS (IPA)
    runs-on: macos-14
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Publish iOS app
        run: dotnet publish VardyParty/VardyParty.csproj -c Release -f net10.0-ios /p:ArchiveOnBuild=true -o ./output/ios
      
      - name: Upload iOS Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./output/ios/VardyParty.ipa
          asset_name: VardyParty-ios-${{ github.ref_name }}.ipa
          asset_content_type: application/octet-stream

  build-macos-release:
    name: Build & Package macOS
    runs-on: macos-14
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Publish macOS app
        run: dotnet publish VardyParty/VardyParty.csproj -c Release -f net10.0-maccatalyst /p:ArchiveOnBuild=true -o ./output/macos
      
      - name: Package macOS
        run: |
          cd output/macos
          zip -r "VardyParty-macos-${{ github.ref_name }}.zip" VardyParty.app
          cd ../..
      
      - name: Upload macOS Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./output/macos/VardyParty-macos-${{ github.ref_name }}.zip
          asset_name: VardyParty-macos-${{ github.ref_name }}.zip
          asset_content_type: application/zip

  build-linux-release:
    name: Build & Package Linux
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build core library for Linux
        run: dotnet build VardyParty.Core/VardyParty.Core.csproj -c Release -f net10.0
      
      - name: Publish Linux app (x64)
        run: dotnet publish VardyParty/VardyParty.csproj -c Release -f net10.0 --self-contained -r linux-x64 -o ./output/linux-x64 || true
      
      - name: Publish Linux app (ARM64)
        run: dotnet publish VardyParty/VardyParty.csproj -c Release -f net10.0 --self-contained -r linux-arm64 -o ./output/linux-arm64 || true
      
      - name: Package Linux x64
        run: |
          cd output
          tar -czf "VardyParty-linux-x64-${{ github.ref_name }}.tar.gz" linux-x64/
          cd ..
      
      - name: Package Linux ARM64
        run: |
          cd output
          tar -czf "VardyParty-linux-arm64-${{ github.ref_name }}.tar.gz" linux-arm64/
          cd ..
      
      - name: Upload Linux x64 Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./output/VardyParty-linux-x64-${{ github.ref_name }}.tar.gz
          asset_name: VardyParty-linux-x64-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip
      
      - name: Upload Linux ARM64 Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./output/VardyParty-linux-arm64-${{ github.ref_name }}.tar.gz
          asset_name: VardyParty-linux-arm64-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip
