<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VardyParty</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="VardyParty.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <style>
        html, body {
            background: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #app {
            min-height: 100vh;
            background: #000;
            color: #fff;
        }
    </style>

    <div id="app"></div>

    <div id="blazor-error-ui" data-nosnippet>
        <span>An unhandled error has occurred.</span>
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
        <pre id="blazor-error-detail" class="blazor-error-detail"></pre>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        let lastConsoleErrorText = '';

        function toErrorText(value) {
            try {
                if (!value) return '';
                if (typeof value === 'string') return value;
                if (value instanceof Error) {
                    return value.stack || (value.name + ': ' + value.message);
                }
                return JSON.stringify(value, null, 2);
            } catch {
                return String(value);
            }
        }

        function argsToText(args) {
            return Array.from(args || []).map(toErrorText).filter(Boolean).join('\n');
        }

        function showBlazorErrorDetail(text) {
            const detail = document.getElementById('blazor-error-detail');
            if (!detail) return;
            detail.textContent = text || '';
            if (text && text.trim().length > 0) {
                detail.style.display = 'block';
            }
        }

        // Mirror console.error into banner details to capture framework-level failures
        const originalConsoleError = console.error?.bind(console);
        console.error = function(...args) {
            const text = argsToText(args);
            if (text) {
                lastConsoleErrorText = text;
                showBlazorErrorDetail(text);
            }
            if (originalConsoleError) {
                originalConsoleError(...args);
            }
        };

        // Enhanced error logging for Android/Windows debugging
        window.addEventListener('error', function(e) {
            const text = [
                e?.message || 'window.error',
                e?.filename ? `file: ${e.filename}:${e.lineno || 0}:${e.colno || 0}` : '',
                toErrorText(e?.error)
            ].filter(Boolean).join('\n');

            console.error('[GLOBAL ERROR]', text);
            showBlazorErrorDetail(text);
        });
        
        window.addEventListener('unhandledrejection', function(e) {
            const text = toErrorText(e?.reason);
            console.error('[UNHANDLED PROMISE]', text);
            showBlazorErrorDetail(text);
        });

        // If framework shows the banner without firing global events, display last known console error
        const errorUi = document.getElementById('blazor-error-ui');
        if (errorUi) {
            const observer = new MutationObserver(() => {
                const shown = getComputedStyle(errorUi).display !== 'none';
                const detail = document.getElementById('blazor-error-detail');
                const hasDetail = detail && detail.textContent && detail.textContent.trim().length > 0;
                if (shown && !hasDetail && lastConsoleErrorText) {
                    showBlazorErrorDetail(lastConsoleErrorText);
                }
            });
            observer.observe(errorUi, { attributes: true, attributeFilter: ['style', 'class'] });
        }

        console.log('[INDEX.HTML] Page loaded, Blazor script should be available');
        console.log('[INDEX.HTML] typeof Blazor:', typeof Blazor);
        
        // Play a simple beep sound using Web Audio API
        window.playClickSound = function() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.type = 'sine';
                osc.frequency.value = 800; // Hz
                gain.gain.value = 0.1; // Volume
                
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.1);
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {
                console.error("Error playing sound:", e);
            }
        };

        // Attach global click listener to play sound
        document.addEventListener('click', function(e) {
            // Play sound for buttons, links, or elements with onclick/tabindex
            if (e.target.closest('button, a, [onclick], [tabindex]')) {
                window.playClickSound();
            }
        }, true); // Capture phase to ensure it runs
    </script>

</body>

</html>
